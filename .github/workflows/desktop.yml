# Desktop installers (Tauri 2): Windows (.msi, .exe), macOS (.dmg, Apple Silicon and Intel),
# Linux (.deb, .rpm). Each job freezes the Python server with PyInstaller (the sidecar),
# builds the chat page and bundles the app. The knowledge pack is not in the installer: the app
# downloads it on first start (after the user agrees) or uses a pack folder.
#
# Runs on tags v* (and then drafts a GitHub release with the installers), when the app code
# changes, and by hand. macOS builds are signed ad hoc (no Apple account): the first start needs
# "Open Anyway" in System Settings; Windows is unsigned (SmartScreen asks once). Real signing
# needs certificates (APPLE_* / WINDOWS_* secrets, see runtime/README.md).
name: Desktop

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "runtime/**"
      - "engramm/**"
      - "ui/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  workflow_call:              # from release.yml, with the catalog of the pack it just published
    inputs:
      catalog_artifact:
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  # a newer push waits for the running build instead of cancelling it (installer builds take ~15 min)
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
            requirements: runtime/sidecar/requirements-macos-x64.txt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Catalog of the published pack (release builds)
        if: ${{ inputs.catalog_artifact }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.catalog_artifact }}
          path: runtime/app/src-tauri/resources

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: runtime/sidecar/requirements.txt

      - name: Freeze the server (PyInstaller)
        shell: bash
        run: |
          pip install -r "${{ matrix.requirements || 'runtime/sidecar/requirements.txt' }}"
          pyinstaller --noconfirm --log-level WARN --distpath build/sidecar --workpath build/pyi runtime/sidecar/engramm-server.spec
          mkdir -p runtime/app/src-tauri/resources/sidecar
          cp -R build/sidecar/engramm-server/. runtime/app/src-tauri/resources/sidecar/

      - name: Smoke test of the frozen server
        shell: bash
        run: python runtime/sidecar/smoke_test.py runtime/app/src-tauri/resources/sidecar

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Chat page
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            runtime/app/src-tauri
            runtime/core

      - name: Network core (engramm-core with Tor) next to the frozen server
        # all network access of the app goes through this binary (docs/SPEC_ATLAS.md); without it
        # the server would fall back to Python sockets and the messenger would have no Tor
        working-directory: runtime/core
        shell: bash
        run: |
          cargo build --release --features tor --target ${{ matrix.target }}
          exe=engramm-core; if [ "$RUNNER_OS" = "Windows" ]; then exe=engramm-core.exe; fi
          cp "target/${{ matrix.target }}/release/$exe" ../app/src-tauri/resources/sidecar/
          echo '{"op":"status","id":1}' | "../app/src-tauri/resources/sidecar/$exe" egress | tee status.json
          grep -q '"tor":true' status.json

      - name: Icons
        working-directory: runtime/app
        shell: bash
        run: |
          npm install
          npx tauri icon ../../desktop/build/icon.png

      - name: App tests
        working-directory: runtime/app/src-tauri
        shell: bash
        run: cargo test --release --target ${{ matrix.target }}

      - name: Installers
        working-directory: runtime/app
        shell: bash
        # Linux: .deb and .rpm (linuxdeploy cannot bundle the frozen server's numba libraries into an AppImage)
        run: npx tauri build --target ${{ matrix.target }} ${{ runner.os == 'Linux' && '--bundles deb,rpm' || '' }}

      - name: Signature check (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # without a signed bundle, macOS calls a downloaded app "damaged"; the ad-hoc signature
        # ("signingIdentity": "-") must cover the whole bundle, the frozen server included
        run: |
          app="runtime/app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/ENGRAMM.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Signature=adhoc|Sealed Resources"
          codesign -dv "$app" 2>&1 | grep -q "Sealed Resources"
          # the frozen server still starts from inside the signed bundle
          python runtime/sidecar/smoke_test.py "$app/Contents/Resources/sidecar"

      - uses: actions/upload-artifact@v4
        with:
          name: engramm-${{ matrix.target }}
          if-no-files-found: error
          path: |
            runtime/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            runtime/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            runtime/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            runtime/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            runtime/app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Checksums
        run: |
          cd dist
          find . -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \) -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.deb
            dist/**/*.rpm
            dist/SHA256SUMS.txt
