# Fast checks on every push: Python tests that need no large data, the Rust core with its
# conformance tests against Python, and the chat page (type check + build).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: runtime/sidecar/requirements.txt
      - name: Install
        run: pip install numpy==2.4.1 numba==0.67.0 tokenizers==0.23.2 pyyaml pytest==9.1.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime/core
      - name: Rust core (unit tests, then release binary for the conformance tests)
        working-directory: runtime/core
        run: |
          cargo test --release --all-features
          cargo build --release --features fetch
      - name: Conversation bank is compiled from data/conv
        run: python -m engramm.chat.studio check
      - name: Python tests
        env:
          ENGRAMM_CORE_BIN: runtime/core/target/release/engramm-core
        run: >
          python -m pytest -q tests/test_chat_units.py tests/test_chat_writing.py tests/test_chatbench.py
          tests/test_chat_app.py tests/test_chat_flows.py tests/test_kb.py tests/test_runtime_core.py tests/test_nlp.py

  ui:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Type check and build
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: The committed page is the built page
        run: |
          if ! git diff --exit-code -- engramm/app/web; then
            echo "engramm/app/web is out of date - run 'npm run build' in ui/"
            exit 1
          fi
