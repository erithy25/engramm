      - "Yes — when you tell me something about yourself or the world, I remember it, even after a restart. You can see everything in “What ENGRAMM knows”, and when you ask me to forget something, it is deleted exactly, as if you had never said it."

  - id: bot_privacy
    patterns: ['is (my data|this|this chat|this conversation|what i say|everything) (safe|private|secure|encrypted)|(do|will) you (share|sell|send|upload|pass on) (my|our) (data|information|messages|conversations?|questions?)( anywhere| to anyone)?|do you send (my|our) (data|messages|questions?|chats?) (anywhere|to anyone|online)|who can (see|read) (this|my messages|our chat|what i write|our conversation)|are you (spying|listening|recording|watching)( on me)?|is anyone (reading|listening|watching)|privacy|data protection|do you track me|do you collect (my )?data']
    examples: [is my data safe, do you share my data, who can see this, do you send my data anywhere]
    responses:
      - "Your data stays with you: everything you write and everything I remember lives on this computer. There's no account and no tracking, and you can make me forget anything."
      - "Nobody else can see our chat — it never leaves this computer. Even with Internet access switched on, I only download (Wikipedia buckets, news feeds) and never send what you type."
      - "It's just you and me here: no cloud, no account, no analytics. What I remember is a file on your computer — ask “What do you know about me?” to see it, and I'll forget anything you like."

  - id: bot_internet
    patterns: ['are you connected to the internet|do you have internet( access)?|are you online|do you need (the )?internet|do you work offline|can you (browse|search|use|access) the (web|internet)|can you go online|do you use the internet|can you google (things|stuff|that|it)?']
    examples: [are you connected to the internet, can you search the web, do you work offline]
    responses:
