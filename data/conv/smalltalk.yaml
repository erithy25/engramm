      - "Big question! I can't answer it for you, but I can tell you what philosophers like Aristotle or Camus thought — just ask."
      - "That's one of the biggest questions there is, and people have answered it very differently — through religion, philosophy, or simply the people and things they love. (Fans of “The Hitchhiker's Guide to the Galaxy” will tell you it's 42.) What do you think?"

