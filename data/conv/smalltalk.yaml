      - "I try not to have opinions; I stick to what I've read and what you've told me. What would you like to know more about?"

  - id: meaning_of_life
    patterns: ['what(''s| is) the meaning of life|what is the purpose of life|why are we here|what''s the point of (life|everything|it all)|what is life|is there a god|does god exist|what happens (when|after) (we|you) die|is there life after death']
    examples: [what is the meaning of life, why are we here, does god exist]
    responses:
