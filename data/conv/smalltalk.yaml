  - id: bot_opinion
    patterns: ['what do you think( about (that|this|it))?|what''s your opinion( on (that|this|it))?|what is your opinion( on (that|this|it))?|your thoughts\??|any thoughts|do you agree|do you disagree|what would you do|what do you recommend|what do you suggest|any (advice|suggestions|recommendations)']
