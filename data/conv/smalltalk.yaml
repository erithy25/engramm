  - id: bot_smart
    patterns: ['(are|r) (you|u) (smarter|cleverer|more intelligent|better) than (me|us|humans|a human|people|my teacher)|(are|r) (you|u) (smart|clever|intelligent|dumb|stupid)|is engramm (smart|clever|intelligent)|do you think you(''re| are) (smart|clever|intelligent)|who(''s| is) smarter,? (you|me)(,? or (me|you))?']
    examples: [are you smarter than me, are you smart, are you intelligent, who's smarter you or me]
    responses:
