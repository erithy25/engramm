    patterns: ['how (do|can) i (turn|switch) on (the )?(internet|internet access|network|online mode|the shelf)|how (do|can) i (enable|activate) (the )?(internet|internet access|network|online mode)|how do you get (online|internet access)|(turn|switch) on (the )?internet( access)?']
