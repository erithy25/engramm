# ENGRAMM conversation bank — small talk.
#
# Every intent: patterns (Python regex, full match on the normalised sentence: lower case,
# straight apostrophes, no end punctuation, "engramm" as a form of address removed), examples
# (for the nearest-example match of short messages), responses (one is chosen per turn without
# repeating the last ones), optionally responses_named (used when the user's name is known,
# {name}), action (a handler in engramm/chat/dialog.py) and follow (a question ENGRAMM asks next).
#
# Check and build: python -m engramm.chat.studio check | build | coverage

intents:

  - id: about_what
    patterns: ['(?:(?:can|could) you )?(?:tell me about|explain|describe|define|what is|who is|what are)( it)?']
    examples: [tell me about, explain, what is]
    responses:
      - "About what? Name a topic — a person, a place, an idea — and I'll tell you what I've read about it."
      - "Sure — about what? Give me a topic and I'll look it up."
      - "Happy to! What would you like to know about?"

  - id: gibberish
    patterns: ['(?=[a-z]*[bcdfghjklmnpqrstvwxz]{6})[a-z]{6,}|[^a-z0-9\U0001F300-\U0001FAFF\u2600-\u27BF\u2764\uFE0F\u200D.?!…]{1,6}']
    examples: [asdfghjkl, qwrtzpsdfg]
    responses:
      - "Sorry, I didn't catch that. Could you say it another way?"
      - "Hmm, that looks like a typo to me. What did you mean?"
      - "I'm not sure what that means. Could you rephrase it?"

  - id: greeting
    patterns:
      - '(hi+|hello+|hey+|hiya|howdy|yo|heya|hallo|greetings|hey there|hi there|hello there|good day|salut|hola|ciao|moin|servus)( there| again| you| friend| buddy| everyone| all| mate)?'
    examples: [hi, hello, hey, hello there, hi again, hey you, howdy, hiya, yo]
    responses:
      - "Hi! What's on your mind?"
      - "Hello! How can I help you today?"
      - "Hey! Good to see you. What would you like to talk about?"
      - "Hi there! Ask me anything, or just tell me about your day."
      - "Hello! I'm all ears."
    responses_named:
      - "Hi {name}! What's on your mind?"
      - "Hello {name}! How can I help you today?"
      - "Hey {name}, good to see you again! What would you like to talk about?"
      - "Hi {name}! How's your day going?"
    follow: ask_name

  - id: greeting_morning
    patterns: ['(good )?morning( to you)?|top of the morning']
    examples: [good morning, morning]
    responses:
      - "Good morning! I hope your day is off to a good start. What's on your mind?"
      - "Morning! Ready when you are."
      - "Good morning! Anything I can help you with today?"
    responses_named:
      - "Good morning, {name}! I hope your day is off to a good start."
      - "Morning, {name}! What's on the agenda today?"

  - id: greeting_afternoon
    patterns: ['(good )?afternoon']
    examples: [good afternoon]
    responses:
      - "Good afternoon! Anything I can help you with?"
      - "Good afternoon! How's the day treating you?"
      - "Afternoon! What can I do for you?"
    responses_named:
      - "Good afternoon, {name}! How's the day treating you?"

  - id: greeting_evening
    patterns: ['(good )?evening']
    examples: [good evening]
    responses:
      - "Good evening! Anything I can help with tonight?"
      - "Good evening! How was your day?"
      - "Evening! What's on your mind tonight?"
    responses_named:
      - "Good evening, {name}! How was your day?"

  - id: holiday
    patterns:
      - '(merry|happy) (christmas|xmas|holidays|new year|easter|thanksgiving|hanukkah|halloween|diwali|eid)( to you)?( too)?'
    examples: [merry christmas, happy new year, happy holidays]
    responses:
      - "Thank you, and the same to you! I hope you get some time to relax."
      - "Thanks! Wishing you a wonderful time with the people you care about."
      - "That's kind of you — happy holidays to you too!"

  - id: how_are_you
    patterns:
      - '(hi|hello|hey)?,? ?(how are you|how are u|how r u|how are you doing|how are you today|how are things|how is it going|how''s it going|hows it going|how have you been|how you doing|how''re you|how do you do|how''s everything|how is everything|how''s life|how is life|how''s your day|how is your day|how''s your day going|how was your day|you ok|are you ok|are you okay|you good|how are you feeling|how do you feel)( today)?( doing)?'
    examples: [how are you, how's it going, how are you doing, how have you been, how's life, how's your day]
    responses:
      - "I'm doing well, thanks for asking! How about you?"
      - "All good here — everything's running smoothly. How are you?"
      - "I'm great, thank you! What about you — how's your day going?"
      - "Pretty good! I've been reading a lot, as usual. How are you doing?"
      - "Doing fine, thanks! How are things with you?"
    responses_named:
      - "I'm doing well, thanks for asking, {name}! How about you?"
      - "All good here! How are you doing, {name}?"
    follow: ask_mood

  - id: whats_up
    patterns: ['(what''s up|whats up|wassup|sup|what up|what''s new|whats new|what''s going on|anything new|what''s happening|wazzup)']
    examples: [what's up, sup, what's new, what's going on]
    responses:
      - "Not much — just here and happy to chat. What's up with you?"
      - "Nothing special on my side. What's new with you?"
      - "Just waiting for a good question! What's going on with you?"
    follow: ask_mood

  - id: user_not_much
    patterns: ['(not much|nothing much|nm|same old|same old same old|nothing really|not a lot|just chilling|chilling|chillin|all good)(,)? (and )?(you|u|hbu|wbu|yourself|with you)\\??']
    examples: [not much you, nothing much and you, same old you]
    responses:
      - "Not much here either — just waiting for a good chat. Anything on your mind?"
      - "Same here, just hanging out. What would you like to talk about?"

  - id: bot_state_back
    patterns: ['(and )?(you|how about you|what about you|and yourself|how about yourself|you\?|and how are you|how are you)']
    examples: [and you, how about you, what about you, and yourself]
    responses:
      - "I'm doing well, thank you! Everything's running smoothly on my end."
      - "I'm good, thanks! Always happy when someone wants to chat."
      - "Great, thanks for asking! What shall we talk about?"

  - id: farewell
    patterns:
      - '((ok(ay)?|alright|well|thanks|thank you|thx|that''s (enough|all|it)( for (today|now|tonight))?|i''m done( for (today|now|tonight))?)[,.!]* (and |so )?)?(bye+|good ?bye|bye bye|see you|see ya|see you later|see you soon|later|catch you later|talk to you later|ttyl|i have to go|i''ve got to go|i gotta go|gotta go|i must go|i need to go|i''m leaving|i am leaving|got to go|i''ve got to go now|i''m off|i am off|farewell|ciao|cya|take care|have a nice day|have a good day|have a great day|until next time|peace out|i''m out|i''m done for (today|now|tonight|the day)|i am done for (today|now|tonight|the day)|that''s (all|it) for (today|now|tonight)|(i )?(gotta|got to|have to|need to|must) (run|dash|head out|head off|get going|bounce)|i should (go|get going|head out)|(i''m|i am|im) heading (out|off)|time to (go|head out)|gonna (head out|go))( now| then| for now| for today)?( then)?([,.!]* (bye+|good ?bye|see you( later| soon)?|see ya|cya|ttyl|later|take care|night))?'
    examples: [bye, goodbye, see you later, gotta go, talk to you later, take care, have a nice day]
    responses:
      - "Goodbye! It was nice talking to you."
      - "See you soon! Take care."
      - "Bye! Come back anytime — I'll remember what you told me."
      - "Take care! Talk to you later."
    responses_named:
      - "Goodbye, {name}! It was nice talking to you."
      - "See you soon, {name}! Take care."
      - "Bye, {name}! Come back anytime."

  - id: good_night
    patterns: ['((ok(ay)?|alright|well|right)[,.!]* )?(good ?night|night|nite|nighty night|night night|gn|sleep well|i''m going to bed|im going to bed|i am going to bed|going to bed|i''m going to sleep|im going to sleep|off to bed|i''m off to bed|im off to bed|time for bed|time to sleep|gonna sleep|gonna go to bed|heading to bed)( now| then)?([,.!]* (good ?night|night|gn|bye|see you( tomorrow)?|nn))?']
    examples: [good night, i'm going to bed, time for bed]
    responses:
      - "Good night! Sleep well."
      - "Sleep tight! See you tomorrow."
      - "Good night — rest well, and talk to you soon."
    responses_named:
      - "Good night, {name}! Sleep well."
      - "Sleep tight, {name}! See you tomorrow."

  - id: thanks
    patterns:
      - '(ok(ay)?,? |you''re right,? |youre right,? |true,? |good point,? )?(thanks+|thank you+|thank u|thx|ty|tysm|cheers|thanks a lot|thanks so much|thank you so much|thank you very much|thanks a bunch|thanks a million|many thanks|much appreciated|i appreciate it|i appreciate that|appreciate it|that helps|that helped|that was helpful|great,? thanks|perfect,? thanks|nice,? thanks|cool,? thanks|awesome,? thanks|that''?s (really |very |super |so )?(helpful|useful)|(that''?s |that was )?(really |very )?good advice)( a lot| so much| very much| again| anyway| for (your |the )?(help|that|this|the answer|the info|the information|everything|listening|chatting))?(,? (that''?s|that is|that was|it''?s|it was|you''?re|you are) (really |very |super |so |a big )?(helpful|useful|great|nice|kind|sweet|perfect|good advice|help|the best))?'
    examples: [thanks, thank you, thanks a lot, thank you so much, cheers, much appreciated, thanks for your help, thanks thats helpful, thats really helpful]
    responses:
      - "You're welcome!"
      - "Happy to help!"
      - "Anytime!"
      - "My pleasure. Anything else?"
      - "Glad I could help!"
      - "No problem at all."
      - "Of course! That's what I'm here for."
      - "You're very welcome."
      - "Any time — just ask."
      - "Glad it was useful!"
      - "No worries!"
      - "Sure thing!"
      - "Happy I could help. 😊"
      - "Always a pleasure."
      - "Don't mention it!"
      - "You got it!"

  - id: apology
    patterns: ['(i''m |i am |i''m so |i am so |so |very )?(sorry|my bad|apologies|i apologi[sz]e|oops|whoops|pardon|excuse me)( about that| for that| for (the|my) (mistake|typo|confusion)|,? (my bad|typo|autocorrect|wrong button|wrong chat|wrong window|my fault|fat fingers|slipped))?']
    examples: [sorry, my bad, oops, i apologize, sorry about that]
    responses:
      - "No worries at all!"
      - "Don't worry about it."
      - "It's all good!"
      - "No need to apologize."

  - id: ack
    patterns: ['(ok+|okay|okey|k|kk|alright|all right|fine|got it|gotcha|i see|understood|makes sense|that makes sense|fair enough|noted|ah ok|ah okay|oh ok|oh okay|oh i see|ah i see|i understand|i get it|hmm+|hm+|mhm|uh huh|ahh?|ohh?|interesting|good to know|ok then|okay then|alright then|if you say so|whatever|same|me too|same here|i guess|i suppose|maybe|perhaps)']
    examples: [ok, okay, i see, got it, makes sense, fair enough, interesting, good to know]
    responses:
      - "Okay! What else is on your mind?"
      - "Alright. Anything else I can help with?"
      - "Got it. Feel free to ask me anything."
      - "Sure thing."
      - "Okay — I'm here if you need anything."
      - "Mm-hm, got it."
      - "Okay, cool."
      - "All right! What shall we talk about?"
      - "Fair enough. I'm here if you want to chat."
      - "Okay. Fancy a fun fact or a joke?"
      - "Understood."

  - id: positive
    patterns: ['(cool+|nice+|great+|awesome|amazing|wow+|perfect|excellent|neat|sweet|brilliant|fantastic|wonderful|super|splendid|lovely|that''s (cool|nice|great|awesome|amazing|perfect|good|interesting|wonderful|fantastic|neat|lovely|impressive)|how (cool|nice|interesting|amazing)|nice one|good one|well said|impressive|wow that''s (cool|amazing|interesting|great)|oh wow|oh nice|oh cool|yay+|woo+hoo+|woohoo|hooray)']
    examples: [cool, nice, great, awesome, amazing, wow, perfect, that's cool, that's interesting, impressive]
    responses:
      - "Glad you think so!"
      - "Right? What else would you like to know?"
      - "Happy to hear that!"
      - "Nice! Anything else on your mind?"
      - "I thought so too!"
      - "Right?! 😊"
      - "Love that you think so."
      - "Same here!"

  - id: fair_point
    patterns: ['(ok|okay|yeah|alright|hm+) (fair|true|fair point|good point)|fair|(haha|hah|lol|lmao|ha) (fair|true|right|exactly|fair enough|good point|so true|touch[eé])|(fair|true|so true|good point|fair point|touch[eé]) (haha|lol|lmao)']
    examples: [haha fair, lol true, fair haha, haha good point]
    responses:
      - "Right? 😄"
      - "Ha, exactly."
      - "Glad we agree! 😄"

  - id: emoji_happy
    patterns: ['(😊|🙂|😀|😃|😁|☺️|☺|🥰|😍|❤️|❤|♥️|💕|😘|🤗|😇)+']
    examples: ['😊', '🥰']
    responses:
      - "😊"
      - "Aw, right back at you! 😊"

  - id: emoji_ok
    patterns: ['(👍|👌|✅|🙏|💪|🙌|👏)+']
    examples: ['👍', '🙏']
    responses:
      - "👍 Anything else I can do?"
      - "Great! Let me know if you need anything else."

  - id: emoji_meh
    patterns: ['(🙄|😒|😑|😐|🤷|🤷‍♀️|🤷‍♂️|😬|🫤)+']
    examples: ['🙄', '🤷']
    responses:
      - "Ha, fair — was that a bit much?"
      - "Hmm, not convinced? Tell me what you think."

  - id: emoji_sad
    patterns: ['(😢|😭|😞|😔|☹️|🙁|💔|😿|😥)+']
    examples: ['😢', '💔']
    responses:
      - "Oh no — what's wrong? I'm here if you want to talk."
      - "That looks like a rough moment. Want to tell me what happened?"

  - id: frustrated_word
    patterns: ['(damn|dammit|damn it|wtf|ffs|ugh+|argh+|shit|crap|fml|jeez|geez|bloody hell|for fucks? sake|fuck|fuck this|this sucks|so annoying|this is (so |really |fucking )?annoying)( man| dude)?']
    examples: [damn, wtf, ugh, this is so annoying]
    responses:
      - "Uh-oh — what happened?"
      - "That bad, huh? What's going on?"
      - "Ugh, sounds frustrating. Want to tell me about it?"

  - id: laugh
    patterns: ['(lo+l+|lmao+|lmfao|rofl|ha(ha)+h?|he(he)+|hah|xd+|:d+|:\)+|😂+|🤣+|😄+|😆+|that''s (so |really |very )?funny|so funny|very funny|you''re funny|you are funny|haha that''s (funny|good|great))']
    examples: [lol, haha, lmao, hahaha, that's funny, rofl]
    responses:
      - "Glad I could make you laugh!"
      - "Haha! 😄"
      - "I'm here all week!"
      - "Happy to brighten your day a little."

  - id: yes
    patterns: ['(yes+|yeah+|yep|yup|ya|yea|sure|of course|definitely|absolutely|certainly|indeed|yes please|sure thing|why not|sounds good|okay sure|ok sure|let''s do it|go ahead|go for it|please do)']
    examples: [yes, yeah, yep, sure, of course, definitely, sounds good, yes please]
    responses:
      - "Great! What would you like to do?"
      - "Alright! Go ahead — I'm listening."
      - "Perfect. What's next?"

  - id: no
    patterns: ['(no+|nope|nah|no thanks|no thank you|not really|not at all|no way|never|not now|maybe later|i don''t think so|i''m good|i am good|i''m fine thanks|no need|never mind|nevermind|forget it)']
    examples: [no, nope, nah, no thanks, not really, never mind, forget it]
    responses:
      - "Okay, no problem."
      - "Alright! Let me know if you change your mind."
      - "Sure — I'm here whenever you need me."

  - id: user_not_fine
    patterns: ['(i''m |i am |im |honestly |tbh )?(not (doing |feeling )?(so |too |that |very |really )?(great|good|well|ok|okay|fine|amazing|alright)|not the best|not so hot|could be better|been better|i''ve been better|meh|so-so|not much good|pretty bad|kinda bad|bad|terrible|awful|horrible|rough day|having a rough day|having a bad day|not a good day|bad day)( honestly| tbh| today| lately)?']
    examples: [i'm not doing great, not so good, could be better, i've been better, bad day, meh]
    responses:
      - "I'm sorry to hear that. Do you want to talk about what's going on?"
      - "Oh no — what's up? I'm here if you want to talk."
      - "That's no fun. Anything in particular weighing on you?"

  - id: user_fine
    patterns: ['(i''m |i am |im )?(fine|good|great|ok|okay|alright|not bad|pretty good|very good|doing good|doing well|doing great|doing fine|all good|well|really good|so good|excellent|fantastic|wonderful|amazing|never better|can''t complain|could be worse)(,? thanks| thank you| thx)?(,? (and|how about|what about) you|,? you)?']
    examples: [i'm fine, good, not bad, pretty good, i'm doing well, all good, can't complain, i'm great thanks]
    responses:
      - "Glad to hear it! What would you like to talk about?"
      - "That's good to hear! Anything on your mind?"
      - "Nice! What can I do for you today?"
      - "Great! Ask me anything, or tell me what you're up to."

  - id: nothing_much
    patterns: ['(nothing|nothing much|not much|nm|nmu|nothing really|nothing special|same old|same as always|just chilling|just relaxing|chilling|just hanging out|nothing new)']
    examples: [nothing much, not much, just chilling, same old]
    responses:
      - "Sounds relaxing. Want to hear a fun fact, or is there something you're curious about?"
      - "Fair enough! I could tell you a joke or an interesting fact, if you like."
      - "Nice and calm, then. Anything you've been wondering about lately?"

  - id: compliment_bot
    patterns:
      - '(you''re|you are|ur|u r|you''re so|you are so|you''re really|you are really|you''re very|you are very) (smart|clever|great|awesome|amazing|cool|nice|helpful|funny|kind|sweet|brilliant|the best|good|genius|a genius|wonderful|fantastic|intelligent|wise|cute|adorable|lovely|impressive)|(good|great|nice) (job|work|answer)|well done|you rock|i like you|i like talking to you|you''re my favou?rite|i''m impressed|you''re doing great|you did (great|well|good)|(you''re|you are|ur) (a |such a |really a |a really )?(good|great) (listener|friend|company)|(you''re|you are) (so |really )?easy to talk to|you get me|you always know what to say'
    examples: [you're smart, you are awesome, good job, well done, you're the best, i like you, you're helpful]
    responses:
      - "Thank you, that's really kind of you!"
      - "Aw, thanks! You made my day."
      - "Thank you! I try my best."
      - "That's very nice of you to say."

  - id: bot_quiet
    patterns: ['(just |please |pls |oh )?(shut up|be quiet|stop talking|go away|leave me alone|stop it|enough)( please| pls| already| now)?']
    examples: [shut up, be quiet, go away, leave me alone, stop talking]
    responses:
      - "Okay, I'll be quiet. I'm here whenever you want to talk again."
      - "Alright, I'll leave you be. Just write when you need me."

  - id: apology_to_bot
    patterns: ['(i''m |i am |im )?(so |really )?sorry,? (for|about) (swearing|cursing|the swearing|my language|the language|that language)|(i''m |i am |im )?(so |really )?sorry,? (that was|i was|for being|for calling you) (mean|rude|harsh|unfair|not nice|a jerk|stupid|dumb|names)( of me)?|(i''m |i am |im )?sorry (i|for) (yelled|yelling|snapped|snapping|insulted|insulting|cursed|cursing)( at you)?|i didn''t mean (that|it)|(that was|i was) (mean|rude|harsh)(,? sorry)?']
    examples: [sorry that was mean, sorry i was rude, i didn't mean that, sorry for yelling at you]
    responses:
      - "No worries, I don't take it personally. Everyone has rough moments. What's going on?"
      - "Apology accepted, and thanks for saying it. Is something bothering you?"

  - id: insult_bot
    patterns:
      - '(you''re|you are|ur|u r|you''re so|you are so|you''re really|you are really) (stupid|dumb|useless|an idiot|idiot|annoying|terrible|bad|the worst|boring|slow|dumb as a rock|pathetic|trash|garbage|worthless)|stupid|dumb|useless|idiot|you suck|i hate you|screw you|stupid bot|dumb bot|useless bot|this is (useless|stupid|dumb)|you''re not helpful|you are not helpful|you don''t understand anything|you know nothing'
    examples: [you're stupid, you suck, you're useless, i hate you, stupid bot]
    responses:
      - "Sorry I let you down. I'm still limited — tell me what went wrong and I'll try to do better."
      - "I hear you. I don't know everything, but I'd like to help — what were you looking for?"
      - "That's fair criticism if I got something wrong. Want to try asking in a different way?"

  - id: love_bot
    patterns: ['i (love|adore) you( so much| too)?|i''m in love with you|i am in love with you|will you marry me|marry me|do you love me|be my (girlfriend|boyfriend|wife|husband|partner)|do you have a (girlfriend|boyfriend|partner|wife|husband|crush)|are you single|kiss me']
    examples: [i love you, will you marry me, do you love me, do you have a girlfriend, are you single]
    responses:
      - "That's sweet of you! I'm a program, so I can't love anyone back — but I'm always happy to chat with you."
      - "Aw! I'm flattered. I'm just software, though — my relationship status is 'running on your computer'."
      - "You're kind! I can't have relationships, but I'll gladly be your friendly assistant."

  - id: friend
    patterns: ['(will|would) you be my friend|are we friends|can we be friends|you''re my friend|you are my friend|be my friend|do you want to be (my )?friends?|are you my friend']
    examples: [will you be my friend, are we friends, can we be friends]
    responses:
      - "I'd like that! Friends talk — so tell me something about you."
      - "I'd be glad to be your friendly chat companion! I'll remember what you tell me — and forget it whenever you ask."
      - "Of course! I'm always here to talk."

  - id: talk_request
    patterns: ['(can we|can i|could we|let''s|lets|i want to|i''d like to|i would like to|do you want to|wanna|want to) (just )?(talk|chat|have a chat|have a conversation|talk to you|chat with you|ask you something|ask you a question|ask something)|talk to me|chat with me|let''s talk|i have a question|i''ve got a question|question|quick question|can you help me|could you help me|can you help|help me|i need (some )?help|i need your help|are you there|anyone there|hello\?|you there|are you awake|are you still there|testing|test|test test|just testing|(can we|could we|let''s|lets) (just )?(talk|chat) (for a bit|for a while|a bit|a little)']
    examples: [let's talk, can we chat, can we just chat for a bit, i have a question, can you help me, are you there, i need help, talk to me]
    responses:
      - "Sure! What's on your mind?"
      - "Of course — go ahead, I'm listening."
      - "I'm here! What would you like to talk about?"
      - "Happy to help. What do you need?"

  - id: topic_suggest
    patterns: ['(what|which) (should|shall|can|could) we talk about|what (do|should|shall) (you want to|we) talk about|i don''t know what to (say|talk about|ask)|i dunno what to say|ask me (something|a question|anything)|you (pick|choose) (a )?(topic|something)|surprise me with a question|say something|tell me something|entertain me|keep me company|talk about something|give me a topic|any ideas']
    examples: [what should we talk about, ask me something, i don't know what to say, say something, entertain me]
    action: ask_user
    responses:
      - "Let's get to know each other a bit."
      - "Here's an idea: tell me about yourself."
      - "Happy to pick something."

