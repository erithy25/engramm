  - id: bot_learn
    patterns: ['can you learn|do you learn|do you learn from (me|us|our conversations?)|are you learning|will you remember (this|that|what i say|what i said)|do you remember (things|our (last )?conversations?)|can you remember things|do you have (a )?memory|what happens (to|with) what i tell you|do you store (my|our) (data|conversations?|messages?|chats?)|do you save (my|our) (data|conversations?|messages?|chats?)']
