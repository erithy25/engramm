# ENGRAMM conversation bank — everyday conversation (Chat v3.1).
#
# Used by engramm/chat/dialog.py through engramm/chat/everyday.py. Placeholders:
#   {topic}   what a moment was about, already in the second person ("your boss", "work")
#   {timeword} "day", "week", "weekend" …
#   {x}       a value (a suggestion, an answer)
#   {title}   an article or work title
#   {name}    your name
# Every list is used without repeating its recent replies.

gibberish:
  first:
    - "Hmm, that looks like a keyboard slip to me. What did you want to say?"
    - "I think your fingers got ahead of you there! What did you mean?"
    - "That one's a mystery to me — could you type it again?"
    - "I couldn't make sense of that. Want to try again, or ask me something?"
  again:
    - "Still not quite getting it — try a few words, like “tell me a joke” or “who painted the Mona Lisa?”."
    - "I'm lost, sorry! Type a question or tell me what's on your mind, and I'll do my best."
    - "Hmm, still not getting that one. Could you say it a different way?"
    - "I think the keyboard got there first! What did you mean?"

discourse:
  # "idk", "not sure" after ENGRAMM asked something
  after_question:
    - "No worries — it doesn't have to be anything big. Want a fun fact while you think?"
    - "That's okay! We can talk about something else. Want a joke or a fun fact?"
    - "Fair enough. Shall I ask you something easier, or would you like a fun fact?"
  plain:
    - "That's okay — not everything needs an answer."
    - "Fair enough."
    - "Totally fine. I'm here if anything comes to mind."
  agree:
    - "Glad we're on the same page!"
    - "Great minds think alike."
    - "Exactly!"
    - "Yes — I think so too."
  question_coming:
    - "Sure — go ahead and ask!"
    - "Of course. What would you like to know?"
    - "I'm all ears. What's your question?"
  help:
    - "I'm here to help. What's going on?"
    - "Of course — tell me what you need, and we'll figure it out together."
    - "Happy to help. What do you need?"
    - "Sure thing. What's up?"
  confused:
    - "Sorry — that's on me. Let's start again: what would you like to know or talk about?"
    - "No problem, let's untangle it. What are you trying to find out?"
    - "My fault — I wasn't clear. What would you like to know?"
    - "Let me try again. What were you asking about?"
    - "Hm, I think I lost the thread. Can you say it another way?"

experience:
  negative:
    person:
      - "Ugh, that sounds frustrating. What did {topic} do?"
      - "Oh no — that's not fun at all. What happened with {topic}?"
      - "That sounds really annoying. Do you want to tell me what happened with {topic}?"
      - "I'm sorry, that's hard. Is this the first time with {topic}, or has it happened before?"
    thing:
      - "Oh no — that sounds rough. What happened?"
      - "That sounds draining. What made {topic} so hard?"
      - "Ugh, I'm sorry. Do you want to talk about {topic}, or would a distraction help more?"
      - "That doesn't sound fun. What went wrong with {topic}?"
    time:
      - "Sounds like a long {timeword}. What made it so tough?"
      - "Oof, that sounds like a rough {timeword}. Want to talk about it?"
      - "I'm sorry your {timeword} was like that. What happened?"
    plain:
      - "I'm sorry, that sounds hard. Want to talk about it?"
      - "That doesn't sound good. What happened?"
      - "Oh no. Do you want to tell me about it, or would a distraction help?"
  positive:
    person:
      - "That's lovely! What did {topic} do?"
      - "Aw, that's great to hear about {topic}! Tell me more?"
      - "That's wonderful news! How do you feel about it?"
    thing:
      - "That's great news about {topic}! What was the best part?"
      - "Nice — sounds like {topic} went really well! How do you feel?"
      - "Congratulations! You must be happy about {topic}. What happened?"
    time:
      - "Sounds like a great {timeword}! What did you get up to?"
      - "Love that! What made your {timeword} so good?"
      - "That's great to hear. What was the highlight of your {timeword}?"
    plain:
      - "That's great to hear! Tell me more?"
      - "Love to hear that! What happened?"
      - "That's wonderful — congratulations!"

offers:
  no:
    - "No problem!"
    - "Alright — just say the word if you change your mind."
    - "Okay! I'm here whenever you want to chat."
  listen:
    - "I'm listening — go ahead."
    - "Of course. Take your time, I'm here."
    - "I'm listening — tell me whenever you're ready."
    - "Go ahead, I'm all ears."
  ideas_none:
    - "Tell me what you'd like ideas for — food, a film, something to do — and I'll suggest a few."

advice:
  # "what should I do?" right after a moment, by what it was about
  work_people:
    - "If it keeps bothering you, a calm one-on-one usually helps: describe the specific thing that happened and how it affected you, rather than the person."
    - "Write down what exactly bothered you while it's fresh — it makes a later conversation much easier, and sometimes it shows the issue is smaller than it felt."
    - "Give it a night before reacting. If it still matters tomorrow, talk to them directly; if it keeps happening, someone you trust at work or HR can help."
  people:
    - "When you're both calm, try telling them how it made you feel — “I felt hurt when…” lands better than “You always…”."
    - "Give it a little time, then talk it through face to face. Most conflicts with people we care about get smaller once both sides feel heard."
    - "Ask yourself what you'd need from them to feel okay again — then tell them that, plainly and kindly."
  heartbreak:
    - "Be kind to yourself — heartbreak really hurts. Lean on friends or family, keep some routine, and give yourself time. It does get easier."
    - "Try not to make big decisions right now. Talk to people who care about you, get outside a little each day, and let yourself feel sad when you need to."
    - "It's okay to grieve the relationship. Maybe take a break from their social media for a while — distance helps the healing."
  grief:
    - "There's nothing to fix about grief — it's love with nowhere to go. Let yourself feel it, and lean on the people around you."
    - "Take it one day at a time. Sharing memories with others who knew them can help, and so can simply resting."
    - "Be patient with yourself. If it ever feels too heavy to carry, talking to a counsellor or your doctor can really help."
  sleep:
    - "When sleep won't come: put the phone away, get up for 15 minutes and do something calm in dim light, then try again. Writing down what's on your mind first can help switch it off."
    - "Try slow breathing — in for 4, hold for 4, out for 6 — and don't check the clock. If thoughts keep coming, jot them down for tomorrow; your brain can let go once they're on paper."
  tired:
    - "Honestly? Rest. Eat something proper, drink some water, and give yourself an early night — tomorrow is a fresh start."
    - "Take a real break: twenty minutes with no screens, maybe a short walk. Then do one small thing that's easy to finish."
    - "Don't try to fix everything tonight. Pick the one thing that can't wait, do it, and let the rest go until tomorrow."
  stress:
    - "Try this: write down everything on your mind, then circle the one thing you can actually do today. The list feels much smaller afterwards."
    - "A few slow breaths help more than they sound — in for four seconds, hold four, out for four, hold four. Then tackle one small task."
    - "Break it into the next tiny step. You don't need to solve the whole thing right now, just the next part."
  sad:
    - "Be gentle with yourself today. Reaching out to someone you trust — even a short message — can help more than you'd expect."
    - "It's okay to have a bad day. Do something kind for yourself: a walk, a favourite song, a good meal. And if it keeps weighing on you, talking to someone helps."
    - "Be gentle with yourself today. A short walk, some music, or talking to someone you trust can help a bit."
    - "Sometimes it helps to name what's weighing on you — and to do one small, kind thing for yourself."
  failure:
    - "One result doesn't define you. Find out where it went wrong, make a plan for next time, and give yourself credit for trying."
    - "Take a breath first. Then look at what you can learn from it — and what you'd do differently. Most people who succeed failed first."
    - "One setback doesn't define you. What would you do differently next time?"
    - "That's frustrating — but it's also information. What's one thing you learned from it?"
  career:
    - "Before you decide, write down what you'd miss and what you wouldn't — and what you'd want from the next job. If the list of “wouldn't miss” is long, start looking quietly before you quit."
    - "It's worth asking: is it the job, the people, or the workload? Sometimes a talk with your manager or a change of team fixes it; sometimes it's time to move on."
    - "If you can, line up something new first — it takes the pressure off. And talk it through with someone who knows you well."
  generic:
    - "What would you tell a good friend in the same situation? That's often the best advice for yourself, too."
    - "Break it down: what's the very next small step you could take? Start there."
    - "If it's not urgent, sleep on it — things often look clearer in the morning."
  none:
    - "About what? Tell me what's going on, and I'll help you think it through."
    - "Happy to help — what's the situation?"
    - "Tell me a bit more about what's going on, and I'll think it through with you."

decide:
  - "Both sound good! Quick trick: imagine I flipped a coin and it said “{x}”. Do you feel relieved or a little disappointed? That feeling is usually your answer."
  - "Tough call! If you had to choose in five seconds — which one? Your gut often knows. If you're still torn, I'd go with “{x}”."
  - "Let me pick for you: “{x}”. If that makes you want to argue for the other one, go with the other one!"

recommend:
