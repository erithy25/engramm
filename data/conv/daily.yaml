# "i read that already" after suggestions
rec_seen:
  - "Ah, then here are some others:"
  - "Fair enough — how about these instead:"
rec_exhausted:
  - "Then you've read more than me in that corner! Want something of a different kind?"
  - "That's all I've got of that kind — impressive! Shall I try a different direction?"

where_were_we:
  - "We were talking about {x}."
  - "Last thing was {x} — want to pick that up again?"
accomplished:
  - "Nice, well done! How does it feel to have {x} behind you?"
  - "That's great — {x}, done! Got anything fun planned now?"
  - "Well done! Was it tough, or did it go smoothly?"
homework:
  - "Of course! What subject is it?"
  - "Happy to help — what's the subject, and what's the question?"
subject:
  math:
    - "{x} — I can do calculations (try “what is 12% of 80”) and explain terms. What's the problem?"
    - "Okay, {x}! Type the problem and I'll work through it with you."
  science:
    - "{x} — I can explain terms and look up facts. What's the question?"
  language:
    - "{x}! I can explain words and check facts about books and authors. What do you need?"
  other:
    - "{x} — okay! What's the question?"

# "how big is the Sun?": the sentence of the topic's own article with that measure
measure_quote:
  - "From the article on {title}: “{evidence}”"
  - "Here's what the article on {title} says: “{evidence}”"

measure_none:
  - "I don't know for sure — the article on {title} that I have doesn't give that clearly, and I'd rather not take a number from somewhere else."

# "how do you know?" right after "are you sure?"
why_again:
  - "As I said, it comes from “{title}”."
  - "Same source as before: “{title}”."

# "I work in private equity"
work_field:
  - "Got it — you work in {x}. Sounds interesting!"
  - "{x} — noted! What do you like most about it?"

# after a loss: "his name was Max" / "he was 14"
grief_name:
  - "{x} — that's a lovely name. What was {pron} like?"
  - "{x}. I'm sure {pron} was very loved. Do you have a favourite memory?"
grief_age:
  - "{x} years is a long life together. You must have so many memories."
  - "{x} — that's a lot of years of friendship. No wonder it hurts so much."
# a short follow-up right after a moment ("it's my second time", "i start monday")
exp_follow_neg:
  - "That makes it even harder. How are you holding up?"
  - "Oh no — I'm sorry. That's a lot to deal with."
  - "I get why that's weighing on you. What would help right now?"
exp_follow_pos:
  - "That's brilliant — you must be really happy!"
  - "Love that! Tell me more?"
  - "So exciting! How are you feeling about it?"
# "i have to give a speech"
speech_mention:
  - "Ooh, a speech! Are you excited or a bit nervous about it? I can help you put it together if you like."
  - "That's a big honour! Want some help with the speech?"
speech_wedding:
  - "Of course! A simple structure that works for a wedding speech:\n\n• Thank everyone for coming and say who you are\n• How you know the groom (or bride) — one short, funny story\n• Something sincere: what makes them great, and what the partner brings out in them\n• A warm word to the couple\n• Raise your glass: “To the happy couple!”\n\nKeep it to 3–5 minutes. Tell me their names and a story, and I'll help you word it."
speech_generic:
  - "Sure! A structure that almost always works:\n\n• Start with who you are and why you're speaking\n• One story or example that makes your point\n• What it means — the one thing people should remember\n• Close with a thank-you or a toast\n\nTell me the occasion and a few details, and I'll help you word it."
# "i'm the best man"
wedding_role:
  - "What an honour! Are you excited — or already thinking about the speech?"
  - "That's a big honour — they clearly trust you a lot! How do you feel about it?"

# "I quit my job" / "I got fired"
job_quit:
  - "Oh wow, that's a big step! How are you feeling about it — relieved?"
  - "That's a big change! Do you already know what's next?"
job_lost:
  - "Oh no, I'm really sorry. That's a hard thing to go through. How are you holding up?"
  - "That's rough — I'm sorry. Was it out of the blue?"
# "how do I boil an egg?": short practical guides ({keys}: words that pick the guide, all of one group must occur)
howto:
  - keys: [[boil, egg], [hard, egg], [soft, egg], [cook, egg]]
    title: "Boiling an egg"
    steps: ["Put the egg in boiling water (lower it in gently with a spoon).", "Soft: 6 minutes · medium: 8 minutes · hard: 10–11 minutes.", "Move it to cold water for a minute — it peels much more easily."]
  - keys: [[cook, pasta], [boil, pasta], [pasta, long], [spaghetti, cook]]
    title: "Cooking pasta"
    steps: ["Use plenty of water (about 1 litre per 100 g) and salt it well once it boils.", "Most dried pasta needs 8–12 minutes — the packet time is a good guide.", "Taste a minute before the end: it should be soft but still have a little bite (al dente).", "Keep a cup of pasta water before draining — it helps the sauce stick."]
  - keys: [[cook, rice], [make, rice], [boil, rice]]
    title: "Cooking rice"
    steps: ["Rinse the rice until the water runs almost clear.", "Use about 1.5 cups of water per cup of white rice (2 for brown).", "Bring to a boil, cover, turn the heat to low: 12–15 minutes (brown: 35–40).", "Let it rest covered for 5–10 minutes, then fluff with a fork."]
  - keys: [[pancake], [pancakes]]
    title: "Simple pancakes"
    steps: ["Mix 200 g flour, 2 tsp baking powder, a pinch of salt and 1 tbsp sugar.", "Whisk in 1 egg, 300 ml milk and 2 tbsp melted butter until just smooth.", "Cook small ladlefuls in a lightly buttered pan on medium heat.", "Flip when bubbles appear on top — about 1–2 minutes per side."]
  - keys: [[hiccup], [hiccups]]
    title: "Getting rid of hiccups"
    steps: ["Hold your breath for 10–20 seconds, then breathe out slowly — repeat a few times.", "Sip a glass of cold water slowly, or swallow a teaspoon of sugar.", "Breathe slowly into cupped hands for a minute.", "Hiccups that last more than two days are worth mentioning to a doctor."]
  - keys: [[tie, tie], [knot, tie], [tie, necktie]]
    title: "Tying a tie (four-in-hand knot)"
    steps: ["Drape the tie around your neck, wide end on your right, hanging about 30 cm lower than the narrow end.", "Cross the wide end over the narrow end, then bring it back underneath.", "Cross it over the front again, then pull it up through the neck loop from below.", "Push it down through the front loop you just made and tighten gently, sliding the knot up."]
  - keys: [[water, drink], [water, day], [hydrated]]
    title: "How much water to drink"
    steps: ["A common guide is about 2–2.5 litres of fluids a day for adults — more when it's hot or you exercise.", "Food and other drinks count too.", "Pale yellow urine is a simple sign you're drinking enough."]
  - keys: [[make, friends], [new, friends], [meet, people]]
    title: "Making friends as an adult"
    steps: ["Go where the same people show up regularly: a class, a club, a sports team, volunteering.", "Repetition matters more than first impressions — keep going for a few weeks.", "Be the one who suggests something small: a coffee, a walk, a game night.", "Follow up: remembering a detail someone told you goes a long way."]
  - keys: [[wear, interview], [dress, interview], [outfit, interview]]
    title: "What to wear to a job interview"
    steps: ["Dress one step smarter than people at the company usually do.", "Clean, well-fitting, simple: neutral colours, nothing distracting.", "When in doubt: smart trousers or skirt, a shirt or blouse, a blazer and clean shoes.", "Lay it out the evening before so the morning is calm."]
  - keys: [[cold], [flu], [sore, throat]]
    title: "Getting over a cold"
    steps: ["Rest, and drink plenty — warm drinks soothe the throat.", "Honey with warm water or tea can calm a cough (not for babies under one).", "Saltwater gargles help a sore throat.", "See a doctor if you have trouble breathing, a high fever for several days, or it lasts over two weeks."]
  - keys: [[headache], [headaches]]
    title: "Easing a headache"
    steps: ["Drink a big glass of water — dehydration is a common cause.", "Rest in a quiet, dim room and take a break from screens.", "A cool cloth on the forehead or a short walk in fresh air can help.", "Sudden, very severe or unusual headaches need a doctor right away."]
  - keys: [[save, money], [saving, money], [budget]]
    title: "Saving money"
    steps: ["Move a fixed amount to savings right after payday — before you can spend it.", "Track your spending for one month; the leaks are usually small and regular.", "Cancel subscriptions you don't use and compare insurance or phone contracts once a year.", "Give your savings a goal — it makes them easier to protect."]
  - keys: [[study], [studying], [learn, faster], [exam, prepare]]
    title: "Studying effectively"
    steps: ["Test yourself instead of rereading — recalling is what makes it stick.", "Spread it out: short sessions over several days beat one long cram.", "Work in 25–50 minute blocks with short breaks, phone in another room.", "Explain the topic in your own words; gaps show up immediately."]
  - keys: [[fall, asleep], [cant, sleep], [can't, sleep], [insomnia]]
    title: "Falling asleep"
    steps: ["Same bedtime and wake-up time every day, also at weekends.", "No screens for the last 30–60 minutes; keep the room cool and dark.", "If you lie awake for more than ~20 minutes, get up and do something calm until you feel sleepy.", "Skip caffeine after lunch and heavy meals late in the evening."]
  - keys: [[stain], [stains]]
    title: "Removing a stain"
    steps: ["Act quickly and blot — don't rub, or it spreads.", "Rinse from the back of the fabric with cold water (hot water sets protein stains like blood).", "Dab on a little washing-up liquid or stain remover, leave for 10 minutes, then wash as usual.", "Check it's gone before drying — heat makes stains permanent."]
  - keys: [[unclog], [clogged], [blocked, drain], [blocked, sink]]
    title: "Unclogging a drain"
    steps: ["Pour a kettle of hot (not boiling, for plastic pipes) water down first.", "Try a plunger: cover the overflow hole and plunge firmly 10–15 times.", "Or half a cup of baking soda, then a cup of vinegar, wait 15 minutes, flush with hot water.", "Still blocked? Clean the trap under the sink, or call a plumber."]
  - keys: [[iron, shirt], [ironing]]
    title: "Ironing a shirt"
    steps: ["Iron while the shirt is slightly damp, on the setting for its fabric.", "Order: collar, cuffs, sleeves, then the back and the two front panels.", "Hang it straight away on a hanger and do up the top button."]
  - keys: [[make, coffee], [coffee, better]]
    title: "Making good coffee"
    steps: ["Use freshly ground beans: about 60 g coffee per litre of water.", "Water just off the boil (about 93–96 °C), not boiling.", "French press: 4 minutes, then press slowly; filter: pour in slow circles.", "Too bitter? Grind coarser or brew shorter. Too sour? Finer or longer."]
  - keys: [[motivated], [motivation]]
    title: "Getting motivated"
    steps: ["Make the first step tiny — two minutes is enough to get started.", "Decide when and where you'll do it, not just what.", "Track streaks: seeing progress is motivating in itself.", "Reward yourself after, not before."]
  - keys: [[relax], [calm, down], [stress, reduce], [less, stressed]]
    title: "Calming down"
    steps: ["Breathe slowly: in for 4 seconds, hold 4, out for 6 — a few rounds.", "Name what's stressing you; writing it down makes it smaller.", "Move: a 10-minute walk lowers stress noticeably.", "Pick one small thing you can do now, and do just that."]
  - keys: [[lose, weight], [weight, loss]]
    title: "Losing weight sensibly"
    steps: ["Aim for slow, steady progress — about 0.5 kg a week is sustainable.", "Protein and vegetables at every meal keep you full longer.", "Watch drinks: juice, soda and alcohol add up quickly.", "Walk more and sleep enough — both matter more than people expect."]
  - keys: [[public, speaking], [give, speech], [presentation, nervous]]
    title: "Speaking in front of people"
    steps: ["Practise out loud at least three times — once in front of someone.", "Know your first two sentences by heart; the rest will follow.", "Slow down and pause — it feels long to you, not to the audience.", "Look at a few friendly faces, one at a time."]
  - keys: [[plant, alive], [water, plants], [houseplant], [plants, dying]]
    title: "Keeping houseplants alive"
    steps: ["Most die from too much water: water when the top 2–3 cm of soil is dry.", "Use pots with drainage holes and empty the saucer.", "Check the light: most houseplants like bright, indirect light.", "Feed lightly in spring and summer, rarely in winter."]
howto_head:
  - "Here's how:"
  - "Here's a simple way:"
howto_none:
  - "I don't have a good guide for that one, sorry. If it's about a thing or a topic, try “tell me about …” and I'll share what I've read."
  - "I'm not sure how — that's not among the things I have practical tips for. I can tell you about the topic itself, though: just say “tell me about …”."

# "I have a cat"
have_pet:
  - "Aww, a {x}! What's their name?"
  - "Oh, I love that — a {x}! What's their name?"
# "how tall is it?" when "it" points nowhere
it_mean:
  - "Sorry — what do you mean by “it”? Give me the name and I'll look it up."
  - "Which one do you mean? Tell me the name and I'll check."
