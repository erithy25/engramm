  monday: ["Mondays, huh. 😩 Rough start, or just the usual Monday feeling?", "Ah, the Monday blues. Is it work, or just getting going again after the weekend?"]
  workload: ["That's exhausting — when extra tasks keep piling up, it feels like you can never catch up. Is it more than you can realistically handle right now?",
             "Ugh, that's a lot. Constant extra tasks wear you down fast. Does your boss know how much is already on your plate?"]
  workload_advice: ["Here's what often helps:\n\n• Make a quick list of everything on your plate, with rough time estimates.\n• Take it to your boss and ask: “Which of these matters most? If I take on the new task, what can wait?”\n• That makes the overload visible without sounding like a complaint — and the priorities become their decision, not your stress.\n\nWant help wording it?"]
