cost_says:
  cheap: "{X} is fairly affordable compared with most of Western Europe and North America: eating out, public transport and museums won't break the bank."
  mid: "{X} is mid-range: not cheap, but manageable. Hotels in the centre and tourist-trap restaurants add up; local trattorias, bakeries and public transport keep it reasonable."
  pricey: "{X} is on the expensive side, especially hotels and eating out in the centre. Booking early, staying a bit further out and eating where locals eat helps a lot."
trip_length:
  - "{X} days in {y} is a nice amount: enough for the highlights without rushing. Want a rough plan for the days?"
  - "{X} days is perfect for {y}. Should I suggest what to see first?"
visa_eu:
  - "No: as an EU citizen you can travel to {x} with just your ID card or passport, no visa needed."
visa_check:
  - "That depends on the rules for your passport, and they change. Please check the official foreign office website of your country before you go. I'd rather not guess on something this important."
cat_small_flat:
  - "Cats usually do fine in small flats, as long as they have things to climb, a window to look out of and someone to play with. Many indoor cats are perfectly happy."
cat_ok:
  - "Yes, absolutely. A calm adult cat is often an even better fit for a small flat than a kitten. Shelters can tell you which cats are relaxed indoors."
cat_need:
  - "For a cat you'll need:\n\n• A litter tray, litter and a scoop\n• Food and water bowls, and good-quality food\n• A scratching post (or two!)\n• A carrier for vet visits\n• A few toys and a cosy bed\n\nAnd a first vet check-up after you get it."
pet_names:
  cat: "A few ideas: Luna, Milo, Simba, Nala, Oliver, Mochi, Pepper or Leo. Do you know yet if it'll be a boy or a girl?"
  dog: "A few ideas: Max, Bella, Charlie, Luna, Buddy, Daisy, Rocky or Nala. Any idea what kind of dog it'll be?"
learn_time:
  - "For simple conversations, most people need about 3–6 months of regular practice, say 20–30 minutes a day. Feeling comfortable takes a year or two."
ache_since:
  - "Since {x} — that's a long time with a headache. Have you had enough water and something to eat today?"
  - "Ugh, since {x}. Have you been staring at a screen a lot, or not drinking much?"
ache_water:
  - "That might well be it: not drinking enough is one of the most common causes of headaches. Have a big glass of water now and another in the next hour."
ache_meds:
  - "Water and a short break from screens first. If it doesn't get better, a common over-the-counter painkiller like ibuprofen or paracetamol can help. Follow the dose on the pack. If it's very sudden and severe, comes with fever, a stiff neck or blurred vision, see a doctor."
ache_ok:
  - "Good idea. I hope it eases off soon! 💧"
  - "Sounds like a plan. Feel better soon!"
spend_on:
  food: "Food is one of the easiest places to save: plan the week's meals, shop with a list (and not hungry!), cook bigger batches and take lunch to work. Eating out once a week less often saves more than you'd think."
  eating out: "Eating out adds up fast. Try cooking on weekdays and keeping restaurants for one special evening a week, and take lunch from home."
  coffee: "A daily café coffee can be 60–100 a month. A good thermos and coffee from home, plus the café as a treat once or twice a week, makes a real difference."
  clothes: "For clothes: a 48-hour rule before buying, unsubscribing from shop newsletters and checking second-hand first helps a lot."
  shopping: "A 48-hour rule before non-essential buys works wonders, and so does deleting saved card details from shopping sites."
  subscriptions: "List every subscription and cancel what you haven't used in the last month. Most people find at least one or two."
  other: "Track that spending for a month, then set a weekly limit for it. Seeing the number usually does half the work."
budget_rule:
  - "A popular one is 50/30/20: 50% of your take-home pay for needs (rent, bills, groceries), 30% for wants and 20% for savings or paying off debt. Adjust it to your situation. Even 10% saved is a great start."
credit_stolen:
  - "That's so frustrating — and unfair. You did the work and someone else gets the recognition. How long has this been going on?"
  - "Ugh, that's one of the most annoying things at work. Does your boss know what you actually contributed?"
credit_again:
  - "Again? Then it's a pattern, not an accident — it's fair to do something about it."
talk_boss:
  - "I think it's reasonable, yes. Keep it factual: what you did, with dates or emails, and ask how to make your contributions more visible. It doesn't have to sound like a complaint about your colleague."
bring_up:
  - "Something like: “I'd like to make sure my work is visible. On the X project I did A and B (here's the email). How can we make it clearer who did what in future?” Calm, factual, and focused on the work, not on blame. It also helps to send short recap emails after you finish something."
