    - "That sounds awful. Panic attacks can feel like something terrible is happening. How are you feeling right now?"
  panic_scary:
    - "It really is — your body goes into full alarm even though you're not actually in danger. You got through it, though, and it did pass."
    - "Of course it was. The racing heart and the fear feel so real. It's good that you're talking about it."
