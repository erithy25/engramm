    - {name: "Simple ramen", steps: ["Simmer stock with soy sauce, garlic and ginger.", "Cook the noodles separately.", "Soft-boil an egg (about 6½ minutes).", "Put noodles in a bowl, pour over the broth, top with egg, spring onion and whatever you like."]}
