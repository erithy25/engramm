first_car:
  - "For a first car:\n\n• Used and reliable beats new and expensive — a small, popular model is cheap to insure and repair\n• Check insurance costs before you buy; they can be huge for new drivers\n• Get it checked by a mechanic, and look at the service history\n• Test drive it on different roads\n\nAnd enjoy the freedom! 🚗"
friend_said:
  - "Ouch, that stings to hear. Do you think there's something to it, or did it feel unfair?"
maybe_right:
  - "That takes courage to admit. It doesn't make you a bad friend — it means you care enough to think about it."
apologize:
  - "A good apology is simple:\n\n• Say sorry for the specific thing (“I'm sorry I haven't been listening properly”)\n• No “but” — don't explain it away\n• Show you understand how it felt for her\n• Say what you'll do differently\n\nAnd then really listen to what she says."
call_friend:
  - "Good luck — I hope you two sort it out. Real friendships survive a fight. 💛"
divorce_parents:
  - "I'm sorry. That's hard at any age — it's still your family and your home that's changing. How are you feeling about it?"
not_a_kid:
  - "Still — it's your family. Being an adult doesn't mean it doesn't hurt."
still_hurts:
  - "Of course it does. You're allowed to feel sad about it, however old you are. Be kind to yourself, and talk to the people close to you."
