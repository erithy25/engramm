learning:
  guitar:
    start: ["Oh nice, the {x}! How long have you been playing?", "That's awesome — the {x} is such a fun one. Acoustic or electric?"]
    pain: ["Totally normal at the start — your fingertips are building calluses. Short sessions (15–20 minutes) a few times a day help, and after 2–3 weeks it gets much better. Take a break if it really hurts."]
    hard: ["Everyone feels that at first — chord changes are clumsy for weeks, then suddenly they click. Practise just two chords back and forth for a few minutes a day; it adds up fast."]
    how_long: ["With 15–30 minutes a day, most people play simple songs after 2–3 months and feel fairly comfortable after about a year. Regular short practice beats long sessions once a week."]
    songs: ["Good beginner songs: “Knockin' on Heaven's Door” (G, D, Am, C), “Horse with No Name” (two chords!), “Stand by Me”, “Three Little Birds” and “Wonderwall” with a capo. Start with the one you like most — motivation matters more than difficulty."]
    tips: ["A few things that help: practise a little every day, use a metronome slowly, learn songs you love, and record yourself now and then — you'll hear the progress."]
  piano:
    start: ["Oh, lovely — the {x}! Are you learning with a teacher, an app or on your own?"]
    hard: ["That's normal — getting both hands to do different things is the hardest part. Practise each hand alone first, then together really slowly."]
    how_long: ["With regular practice (20–30 minutes a day), simple pieces are possible after a few months, and many people play comfortably after a year or two."]
    songs: ["Nice starter pieces: “Heart and Soul”, the first part of “Für Elise”, “Let It Be” (simplified), “River Flows in You” (easy version) and “Ode to Joy”."]
    tips: ["Practise slowly and with a steady rhythm, little and often, and learn to read simple sheet music early — it pays off later."]
  drums:
    start: ["Drums — that's so much fun! Do you have a kit at home or a practice pad?"]
    how_long: ["Basic rock beats come within a few weeks; playing along to songs comfortably usually takes a few months of regular practice."]
    tips: ["Use a metronome from day one, start slow, and protect your ears — earplugs make a big difference."]
  violin:
    start: ["The {x}! That's a beautiful instrument — and a brave choice. How's it going so far?"]
    how_long: ["Honestly, the violin takes patience: a clean sound often takes several months, and simple tunes sound nice after about a year."]
    tips: ["Practise in front of a mirror to check your bow, keep sessions short and regular, and tune before every practice."]
  ukulele:
    start: ["A {x}! Great choice — it's one of the friendliest instruments to start with. What made you pick it?"]
    how_long: ["The ukulele is quick to learn: many people play simple songs within a couple of weeks."]
    songs: ["Easy ukulele songs: “Riptide”, “I'm Yours”, “Somewhere Over the Rainbow” and “Stand by Me”."]
  language:
    start: ["{x}! That's great. What made you want to learn it — travel, work, someone special?", "Oh nice, {x}! How long have you been learning?"]
    hard: ["Every learner hits that wall — it usually means you're about to improve. Keep sessions short and daily, and don't be afraid of mistakes."]
    how_long: ["For everyday conversations, most people need roughly 6–12 months of regular practice. Languages close to English (Spanish, French, Italian) are usually quicker than Japanese or Arabic."]
    tips: ["Learn a few words every day, listen to podcasts or shows in {x}, speak out loud even if it feels silly, and try a language exchange partner."]
