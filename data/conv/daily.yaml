interview_q:
  weakness:
    - "Pick a real but harmless weakness and show what you do about it. For example: “I used to take on too much myself — now I plan my week and ask for help earlier.” Honest, short, and it ends on growth. Avoid fake ones like “I'm a perfectionist”."
  strength:
    - "Name one or two strengths that fit the job and back each with a short example: “I'm good at explaining complicated things — in my last job I trained all the new colleagues.” Examples beat adjectives."
  salary:
    - "Know your number before you go in — check typical salaries for the role. If they ask, give a range with your target near the bottom of it, and say you're flexible depending on the whole package."
  why:
    - "Keep it about them and about the future: what excites you about this company and role, and what you'd bring. Skip anything negative about your old job."
