  - "Tip: tackle the biggest task first and keep the evening for something nice."
remind:
  - "I can't send notifications — I only live inside this chat. But I've noted it: you want to {x}. Ask me “what do I need to do?” any time."
  - "No alarms on my side, sorry — but it's written down: {x}. Just ask me later what you needed to do."
