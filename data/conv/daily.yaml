  - "With {x} in mind: {y}. Add a handwritten card and it's perfect."
gift_budget:
  - "Under {x}, still easy: {y}. And a handwritten card costs nothing but means a lot."
decide_ask:
  - "That's a tough spot to be in. What are the two options? Tell me what each one has going for it."
decide_tradeoff:
  - "The classic one: money versus meaning. A few questions that help: Would the lower salary still cover your life comfortably? Which job would you be proud of in two years? And which one would teach you more?"
decide_view:
  - "If the lower salary still pays your bills comfortably, I'd lean towards the more interesting one. Interest keeps you motivated, you learn faster, and that usually pays off later too. If money is tight right now, though, the better-paid one is a perfectly good choice."
decide_agree:
  - "Sounds like you already knew deep down. Good luck with it! 🍀"
run_start:
  - "Love it! Running is one of the easiest sports to start: just shoes and a door. Have you run before, or is this a fresh start?"
run_beginner:
  - "That's totally fine — everyone starts somewhere. The trick is to start slower than you think: walk–run intervals, and you'll be surprised how fast you improve."
run_often:
  - "Three times a week is perfect for starting, with a rest day in between so your body can adapt."
run_far:
  - "Don't think in distance yet, think in time: 20–30 minutes of alternating 1 minute running and 2 minutes walking. Every week, run a bit more and walk a bit less. In 8–10 weeks most people can run 30 minutes straight."
run_shoes:
  - "Proper running shoes matter most, ideally from a running shop where they look at how you run. Comfortable and cushioned beats fashionable. The rest (shorts, a T-shirt that isn't cotton) can be anything."
run_go:
  - "Great — go slow, enjoy it, and tell me how the first run went! 🏃"
kid_nervous:
  - "That's so normal before a test — it shows he cares. How old is he?"
  - "Aw, poor thing. Nerves before a test are completely normal. What's he most worried about?"
kid_help:
  - "A few things that help:\n\n• A short, relaxed review tonight instead of last-minute cramming\n• A good night's sleep and a proper breakfast\n• Tell him that mistakes are okay and that you're proud of him for trying\n• A simple breathing trick for the test: in for 4, out for 6\n\nYour calm helps him most."
kid_age:
  - "At {x}, a calm evening and knowing you're not worried about the grade makes a big difference. Maybe do one or two practice problems together, then something fun to switch off."
guests_ack:
  - "Nice, a dinner party! How many people are coming?"
guests_count:
  - "{X} people — a proper dinner! Any dietary needs, like vegetarian or allergies?"
guests_vegan:
  - "Good to know. The easiest way is a main everyone can eat, so the vegan guest doesn't get a sad side dish. Want ideas?"
guests_menu_vegan:
  - "For a group with a vegan guest:\n\n• A big vegetable and chickpea curry with rice and naan, everyone loves it\n• Chili sin carne with all the toppings, guests add what they like\n• Pasta with a rich tomato and roasted vegetable sauce\n\nAll of them scale easily for {x} and can be made ahead."
guests_menu:
  - "For {x} people, something you can make ahead works best:\n\n• Lasagne or a vegetable lasagne\n• A big curry with rice\n• A roast chicken with roast vegetables\n\nThen you can enjoy your guests instead of standing at the stove."
guests_time:
  - "About an hour, most of it hands-off simmering — and all of them taste even better made a few hours ahead."
dessert_vegan:
  - "Vegan desserts everyone likes:\n\n• Sorbet with fresh berries\n• Dark chocolate mousse (many dark chocolates are vegan)\n• Baked apples with cinnamon and a crumble topping\n• A big fruit platter with melted dark chocolate for dipping"
dessert_guests:
  - "For dessert: a tiramisu or panna cotta made the day before, or a simple fruit crumble with ice cream."
