    egg: "No eggs? Per egg, mash half a ripe banana or use 3 tbsp applesauce — or just add a splash more milk and ½ tsp extra baking powder. They'll be a bit flatter, but still good."
    milk: "No milk? Use the same amount of water or any plant milk (oat milk works great). With water they're just a little less rich."
    butter: "No butter? Use the same amount of a neutral oil (sunflower or rapeseed) — works just as well."
    baking powder: "No baking powder? Use ½ tsp baking soda plus 1 tbsp lemon juice or vinegar — or beat the egg white stiff and fold it in."
    sugar: "Just leave it out, or use a little honey or maple syrup instead. For savoury versions you don't need any."
    flour: "No flour? Blend oats into a fine powder and use about the same amount."
