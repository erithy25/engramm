    - {name: "Butter chicken", steps: ["Marinate chicken in yoghurt, garam masala and garlic.", "Fry it, then set aside.", "Make a sauce of butter, onion, tomato passata and spices; simmer 10 minutes.", "Add cream and the chicken, simmer 10 more minutes, serve with rice."]}
