prepare:
  presentation:
    - "For the presentation:\n\n• Write down your three key points — everything else supports them\n• Practise out loud at least three times, once in front of someone\n• Know your first two sentences by heart\n• Check the tech and your slides the day before\n• Sleep well the night before — it matters more than one more run-through\n\nWant help with the opening?"
  interview:
    - "For the interview:\n\n• Read up on the company and the role — know why you want it\n• Prepare three short stories about things you achieved\n• Have two or three questions for them ready\n• Pick your outfit and route the day before\n\nYou'll do great!"
  exam:
    - "For the exam:\n\n• Make a plan: which topics on which day\n• Practise with old questions instead of only re-reading\n• Short breaks every 45–60 minutes\n• Sleep well the night before — no all-nighter\n\nWhat subject is it?"
  meeting:
    - "For the meeting:\n\n• Know what you want to get out of it — one sentence\n• Jot down your key points and any numbers you need\n• Think about the questions others might ask\n\nThat's usually enough to feel prepared."
  date:
    - "For the date:\n\n• Pick a place where you can talk — not too loud\n• Have a couple of easy questions in mind (travel, food, weekends)\n• Wear something you feel good in\n• And remember: they're probably just as nervous!"
  none:
    - "Prepare for what exactly — a presentation, an interview, an exam? Tell me and I'll give you a plan."
cuisine_ideas:
  italian:
    - {name: "Spaghetti carbonara", steps: ["Cook the spaghetti in well-salted water.", "Whisk 2 eggs plus 1 yolk with plenty of grated parmesan and black pepper.", "Fry diced pancetta or bacon until crisp.", "Drain the pasta (keep a cup of the water), toss it with the pancetta off the heat.", "Stir in the egg mix quickly, adding a splash of pasta water until creamy — no scrambled eggs!"]}
    - {name: "Mushroom risotto", steps: ["Soften a chopped onion in butter, add 300 g risotto rice and toast for a minute.", "Add a splash of white wine and let it cook away.", "Add hot stock one ladle at a time, stirring, for about 18 minutes.", "Fry sliced mushrooms separately and stir them in.", "Finish with butter and parmesan, rest 2 minutes, serve."]}
    - {name: "Homemade margherita pizza", steps: ["Mix 500 g flour, 7 g yeast, 1 tsp salt and 325 ml warm water; knead 10 minutes.", "Let it rise for 1–2 hours.", "Stretch it thin, spread tomato sauce, add mozzarella.", "Bake as hot as your oven goes (250 °C+) for 8–10 minutes.", "Top with fresh basil and a little olive oil."]}
  mexican:
