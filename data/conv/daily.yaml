word_defs:
  ubiquitous: ["found everywhere, seeming to be present all the time", "Smartphones have become ubiquitous: almost everyone has one."]
  ambiguous: ["open to more than one meaning; unclear", "His answer was ambiguous, so nobody knew if he agreed."]
  empathy: ["the ability to understand and share someone else's feelings", "She showed real empathy when her friend lost his job."]
  nostalgia: ["a sentimental longing for the past", "Old songs from school always fill me with nostalgia."]
  irony: ["when the opposite of what you expect happens, or saying the opposite of what you mean", "The fire station burned down: what irony."]
  procrastinate: ["to keep putting off something you should do", "I always procrastinate when I have to do my taxes."]
  resilient: ["able to recover quickly from difficulties", "Children are often more resilient than we think."]
  sustainable: ["able to continue without harming the environment or running out", "We need more sustainable ways to produce energy."]
  pragmatic: ["dealing with things in a practical, realistic way", "She took a pragmatic approach and fixed what she could."]
  cynical: ["believing that people are mostly selfish or dishonest", "After years in politics, he became quite cynical."]
  eloquent: ["fluent and persuasive in speaking or writing", "She gave an eloquent speech at the wedding."]
  meticulous: ["very careful and precise about details", "He keeps meticulous notes of every meeting."]
  inevitable: ["certain to happen, impossible to avoid", "With that much rain, flooding was inevitable."]
  paradox: ["a statement that seems to contradict itself but may be true", "It's a paradox: the more choices we have, the less happy we feel."]
  metaphor: ["a figure of speech describing something as if it were something else", "“Time is money” is a metaphor."]
  sarcasm: ["saying the opposite of what you mean, usually to mock or joke", "“Oh great, another meeting,” she said with heavy sarcasm."]
  entrepreneur: ["someone who starts and runs their own business", "She became an entrepreneur at 25 when she opened her café."]
  algorithm: ["a step-by-step set of rules for solving a problem, often by a computer", "The app uses an algorithm to suggest songs."]
  inflation: ["a general rise in prices, so money buys less", "High inflation made groceries much more expensive."]
  democracy: ["a system of government in which the people choose their leaders by voting", "In a democracy, every citizen can vote."]
  serendipity: ["finding something good by happy chance", "Meeting my best friend on a delayed train was pure serendipity."]
  melancholy: ["a deep, often thoughtful sadness", "There was a quiet melancholy in his music."]
  benevolent: ["kind and well-meaning", "The benevolent old man paid for everyone's coffee."]
  tedious: ["long, slow and boring", "Filling in the forms was tedious."]
  versatile: ["able to do many different things well", "A good knife is the most versatile tool in the kitchen."]
