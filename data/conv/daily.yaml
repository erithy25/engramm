  - "Same as always: chatting and reading. My weekends are very relaxed! What are you up to?"
hike_plan:
  - "Hiking sounds lovely! Do you know where yet, or still looking for a trail?"
  - "Oh nice, a hike! Fresh air after a long week is exactly right. Where are you thinking of going?"
hike_tips:
  - "A few hiking basics:\n\n• Pick a route a bit shorter than you think, and check the weather in the morning\n• Start early, it's cooler and less crowded\n• Tell someone where you're going\n• Break in your shoes beforehand, no brand-new boots\n• Turn around if the weather turns: the mountain will still be there"
hike_bring:
  - "For a day hike:\n\n• Water (plenty) and snacks, like nuts, a sandwich, fruit\n• Layers: a warm top and a rain jacket, even if it's sunny\n• Good shoes with grip\n• Sun cream, sunglasses, a cap\n• Phone with the map downloaded, plus a power bank\n• A small first-aid kit and plasters"
hike_water:
  - "Roughly half a litre per hour of hiking, more when it's hot or steep. For a 4-hour hike, 2 litres is a good start."
same_again:
  - "You've said that a few times now 😄 Everything alright? If you're not sure what to ask, I could tell you a fun fact or quiz you."
  - "Ha, I'm getting déjà vu! 😄 Anything specific on your mind? I'm happy to suggest something."
