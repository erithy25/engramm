  - "Aww, a girl! Your friend must be so excited. 💕"
baby_gift:
  - "For a baby on the way:\n\n• Something soft: a nice blanket or a cuddly toy\n• Practical things parents always need: muslin cloths, bodysuits in size 68–74\n• A meal voucher or cooking for them in the first weeks — new parents love that\n• A photo album or baby journal\n\nAnd a card for your friend — she's the one doing the hard work!"
first_try:
