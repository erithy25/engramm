    - {name: "Bean burritos", steps: ["Fry onion and garlic, add black beans, cumin and a little water; mash lightly.", "Cook some rice.", "Fill large tortillas with rice, beans, cheese and salsa.", "Roll them up and toast in a pan until golden."]}
    - {name: "Guacamole with nachos", steps: ["Mash 2 ripe avocados.", "Mix in lime juice, salt, finely chopped onion, tomato and coriander.", "Serve right away with tortilla chips."]}
  indian:
