  - keys: [[cook, pasta], [boil, pasta], [pasta, long], [spaghetti, cook]]
    title: "Cooking pasta"
    steps: ["Use plenty of water (about 1 litre per 100 g) and salt it well once it boils.", "Most dried pasta needs 8–12 minutes — the packet time is a good guide.", "Taste a minute before the end: it should be soft but still have a little bite (al dente).", "Keep a cup of pasta water before draining — it helps the sauce stick."]
  - keys: [[cook, rice], [make, rice], [boil, rice]]
    title: "Cooking rice"
    steps: ["Rinse the rice until the water runs almost clear.", "Use about 1.5 cups of water per cup of white rice (2 for brown).", "Bring to a boil, cover, turn the heat to low: 12–15 minutes (brown: 35–40).", "Let it rest covered for 5–10 minutes, then fluff with a fork."]
  - keys: [[pancake], [pancakes]]
    title: "Simple pancakes"
    steps: ["Mix 200 g flour, 2 tsp baking powder, a pinch of salt and 1 tbsp sugar.", "Whisk in 1 egg, 300 ml milk and 2 tbsp melted butter until just smooth.", "Cook small ladlefuls in a lightly buttered pan on medium heat.", "Flip when bubbles appear on top — about 1–2 minutes per side."]
  - keys: [[puppy], [new, dog], [dog, tips], [puppy, owner]]
    title: "Tips for a new puppy"
    steps: ["Take them outside often — after waking up, after eating and after playing — and praise them right away.", "Keep a simple routine for food, walks and sleep; puppies sleep 18 hours a day.", "Give them chew toys so your shoes stay safe.", "Short, positive training sessions (a few minutes) work best — and book a first vet visit for vaccinations."]
  - keys: [[sore, throat], [throat, hurt], [throat, hurts]]
    title: "Things that help with a sore throat"
    steps: ["Warm drinks — tea with honey and lemon is a classic.", "Gargle with warm salt water (half a teaspoon of salt in a glass of water) a few times a day.", "Throat lozenges and enough sleep; avoid smoke and very dry air.", "See a doctor if it lasts more than a week, you have a high fever, or it's hard to swallow or breathe."]
  - keys: [[headache], [head, hurts], [migraine]]
    title: "Things that help with a headache"
    steps: ["Drink a big glass of water — mild dehydration is a common cause.", "Rest somewhere quiet and dark, away from screens, for a while.", "A cool cloth on your forehead or a short walk in fresh air can help.", "A standard painkiller can help if it's okay for you; see a doctor if headaches are severe, sudden or keep coming back."]
  - keys: [[a, cold], [have, cold], [common, cold], [cold, symptom]]
    title: "Getting through a cold"
    steps: ["Rest as much as you can and drink plenty of fluids.", "Warm soup, tea with honey and steam (a hot shower) ease the stuffy feeling.", "Saline nose spray helps with a blocked nose.", "Most colds pass within a week to ten days — see a doctor if you get a high fever or it lasts much longer."]
  - keys: [[cough], [coughing]]
    title: "Things that help with a cough"
    steps: ["Warm drinks with honey soothe the throat (no honey for babies under one).", "Keep the air a bit humid and sleep with your head slightly raised.", "Avoid smoke and drink enough water.", "See a doctor if it lasts more than three weeks, you cough up blood, or you're short of breath."]
  - keys: [[fever]]
    title: "What helps with a fever"
    steps: ["Rest and drink a lot — fever uses up fluids.", "Light clothes and a light blanket; a lukewarm (not cold) cloth can feel good.", "A standard fever reducer can help if it's okay for you.", "See a doctor if it's above 39.5 °C, lasts more than three days, or comes with a stiff neck, rash or confusion."]
  - keys: [[save, money], [saving, money], [spend, less], [money, tips]]
    title: "Ways to save money"
    steps: ["Write down everything you spend for a month — most people find one or two surprises.", "Cancel subscriptions you don't really use, and compare insurance, phone and energy contracts once a year.", "Cook more at home and take lunch with you; plan meals so less food gets thrown away.", "Move a fixed amount to a savings account right after payday, so you never see it.", "Wait 48 hours before any non-essential purchase — often the urge passes."]
  - keys: [[budget]]
    title: "A simple monthly budget"
    steps: ["Start with your monthly income after tax.", "List fixed costs: rent, bills, insurance, transport, debt payments.", "A common rule of thumb is 50/30/20: about 50% for needs, 30% for wants, 20% for savings and paying off debt.", "Set a weekly amount for groceries and fun, and check in every Sunday.", "Tell me your income and rent if you like, and I'll help you do the maths."]
  - keys: [[pack, trip], [pack, holiday], [pack, vacation], [packing]]
    title: "A quick packing list"
    steps: ["Documents first: passport or ID, tickets, bank card, insurance details — and photos of them on your phone.", "Phone, charger, power bank and an adapter if the plugs are different.", "Clothes for the weather plus one layer more than you think, comfortable shoes, swimwear if there's water.", "Toiletries in small sizes, sun cream, any medication you take, and a few plasters.", "Tip: lay everything out, then take half the clothes and twice the money."]
  - keys: [[hiccup], [hiccups]]
    title: "Getting rid of hiccups"
    steps: ["Hold your breath for 10–20 seconds, then breathe out slowly — repeat a few times.", "Sip a glass of cold water slowly, or swallow a teaspoon of sugar.", "Breathe slowly into cupped hands for a minute.", "Hiccups that last more than two days are worth mentioning to a doctor."]
  - keys: [[tie, tie], [knot, tie], [tie, necktie]]
    title: "Tying a tie (four-in-hand knot)"
    steps: ["Drape the tie around your neck, wide end on your right, hanging about 30 cm lower than the narrow end.", "Cross the wide end over the narrow end, then bring it back underneath.", "Cross it over the front again, then pull it up through the neck loop from below.", "Push it down through the front loop you just made and tighten gently, sliding the knot up."]
  - keys: [[water, drink], [water, day], [hydrated]]
    title: "How much water to drink"
    steps: ["A common guide is about 2–2.5 litres of fluids a day for adults — more when it's hot or you exercise.", "Food and other drinks count too.", "Pale yellow urine is a simple sign you're drinking enough."]
  - keys: [[make, friends], [new, friends], [meet, people]]
    title: "Making friends as an adult"
    steps: ["Go where the same people show up regularly: a class, a club, a sports team, volunteering.", "Repetition matters more than first impressions — keep going for a few weeks.", "Be the one who suggests something small: a coffee, a walk, a game night.", "Follow up: remembering a detail someone told you goes a long way."]
  - keys: [[wear, interview], [dress, interview], [outfit, interview]]
    title: "What to wear to a job interview"
    steps: ["Dress one step smarter than people at the company usually do.", "Clean, well-fitting, simple: neutral colours, nothing distracting.", "When in doubt: smart trousers or skirt, a shirt or blouse, a blazer and clean shoes.", "Lay it out the evening before so the morning is calm."]
  - keys: [[cold], [flu], [sore, throat]]
    title: "Getting over a cold"
    steps: ["Rest, and drink plenty — warm drinks soothe the throat.", "Honey with warm water or tea can calm a cough (not for babies under one).", "Saltwater gargles help a sore throat.", "See a doctor if you have trouble breathing, a high fever for several days, or it lasts over two weeks."]
  - keys: [[headache], [headaches]]
    title: "Easing a headache"
    steps: ["Drink a big glass of water — dehydration is a common cause.", "Rest in a quiet, dim room and take a break from screens.", "A cool cloth on the forehead or a short walk in fresh air can help.", "Sudden, very severe or unusual headaches need a doctor right away."]
  - keys: [[save, money], [saving, money], [budget]]
    title: "Saving money"
    steps: ["Move a fixed amount to savings right after payday — before you can spend it.", "Track your spending for one month; the leaks are usually small and regular.", "Cancel subscriptions you don't use and compare insurance or phone contracts once a year.", "Give your savings a goal — it makes them easier to protect."]
  - keys: [[study], [studying], [learn, faster], [exam, prepare]]
    title: "Studying effectively"
    steps: ["Test yourself instead of rereading — recalling is what makes it stick.", "Spread it out: short sessions over several days beat one long cram.", "Work in 25–50 minute blocks with short breaks, phone in another room.", "Explain the topic in your own words; gaps show up immediately."]
  - keys: [[fall, asleep], [cant, sleep], [can't, sleep], [insomnia]]
    title: "Falling asleep"
    steps: ["Same bedtime and wake-up time every day, also at weekends.", "No screens for the last 30–60 minutes; keep the room cool and dark.", "If you lie awake for more than ~20 minutes, get up and do something calm until you feel sleepy.", "Skip caffeine after lunch and heavy meals late in the evening."]
  - keys: [[stain], [stains]]
    title: "Removing a stain"
    steps: ["Act quickly and blot — don't rub, or it spreads.", "Rinse from the back of the fabric with cold water (hot water sets protein stains like blood).", "Dab on a little washing-up liquid or stain remover, leave for 10 minutes, then wash as usual.", "Check it's gone before drying — heat makes stains permanent."]
  - keys: [[unclog], [clogged], [blocked, drain], [blocked, sink]]
    title: "Unclogging a drain"
    steps: ["Pour a kettle of hot (not boiling, for plastic pipes) water down first.", "Try a plunger: cover the overflow hole and plunge firmly 10–15 times.", "Or half a cup of baking soda, then a cup of vinegar, wait 15 minutes, flush with hot water.", "Still blocked? Clean the trap under the sink, or call a plumber."]
  - keys: [[iron, shirt], [ironing]]
    title: "Ironing a shirt"
    steps: ["Iron while the shirt is slightly damp, on the setting for its fabric.", "Order: collar, cuffs, sleeves, then the back and the two front panels.", "Hang it straight away on a hanger and do up the top button."]
  - keys: [[make, coffee], [coffee, better]]
    title: "Making good coffee"
    steps: ["Use freshly ground beans: about 60 g coffee per litre of water.", "Water just off the boil (about 93–96 °C), not boiling.", "French press: 4 minutes, then press slowly; filter: pour in slow circles.", "Too bitter? Grind coarser or brew shorter. Too sour? Finer or longer."]
  - keys: [[motivated], [motivation]]
    title: "Getting motivated"
    steps: ["Make the first step tiny — two minutes is enough to get started.", "Decide when and where you'll do it, not just what.", "Track streaks: seeing progress is motivating in itself.", "Reward yourself after, not before."]
  - keys: [[relax], [calm, down], [stress, reduce], [less, stressed]]
    title: "Calming down"
    steps: ["Breathe slowly: in for 4 seconds, hold 4, out for 6 — a few rounds.", "Name what's stressing you; writing it down makes it smaller.", "Move: a 10-minute walk lowers stress noticeably.", "Pick one small thing you can do now, and do just that."]
  - keys: [[lose, weight], [weight, loss]]
    title: "Losing weight sensibly"
    steps: ["Aim for slow, steady progress — about 0.5 kg a week is sustainable.", "Protein and vegetables at every meal keep you full longer.", "Watch drinks: juice, soda and alcohol add up quickly.", "Walk more and sleep enough — both matter more than people expect."]
  - keys: [[public, speaking], [give, speech], [presentation, nervous]]
    title: "Speaking in front of people"
    steps: ["Practise out loud at least three times — once in front of someone.", "Know your first two sentences by heart; the rest will follow.", "Slow down and pause — it feels long to you, not to the audience.", "Look at a few friendly faces, one at a time."]
  - keys: [[plant, alive], [water, plants], [houseplant], [plants, dying]]
    title: "Keeping houseplants alive"
    steps: ["Most die from too much water: water when the top 2–3 cm of soil is dry.", "Use pots with drainage holes and empty the saucer.", "Check the light: most houseplants like bright, indirect light.", "Feed lightly in spring and summer, rarely in winter."]
howto_head:
  - "Here's how:"
  - "Here's a simple way:"
howto_none:
  - "I don't have a good guide for that one, sorry. If it's about a thing or a topic, try “tell me about …” and I'll share what I've read."
  - "I'm not sure how — that's not among the things I have practical tips for. I can tell you about the topic itself, though: just say “tell me about …”."

# "I have a cat"
have_pet:
  - "Aww, a {x}! What's their name?"
  - "Oh, I love that — a {x}! What's their name?"
# "how tall is it?" when "it" points nowhere
it_mean:
  - "Sorry — what do you mean by “it”? Give me the name and I'll look it up."
  - "Which one do you mean? Tell me the name and I'll check."
job_where:
  - "Nice — {x}! I've noted that's where you work now. What will you be doing there?"
  - "Ooh, {x}! Got it, I'll remember that. What's the role?"
job_start:
  - "Oh, {x} already — that's soon! I've noted it. Anything you want to prepare before then?"
  - "Got it, you start {x}. Exciting! Is there anything you're unsure about yet?"
today_head:
  - "Here's what I have for today:"
  - "For today you told me about:"
today_none:
  - "I don't have anything noted for today. Got something planned? Tell me and I'll keep it in mind."
  - "Nothing on my list for today — a free day? If something comes up, just tell me."
howto_step:
  - "From the steps above: {x}"
  - "That's this part: {x}"
howto_yes:
  - "Yes, it's part of it: {x}"
  - "Yep, it's in there: {x}"
howto_not_in:
  - "This simple version doesn't use {x}, so you can leave it out."
  - "No {x} in this version — you're fine without it."
like_title:
  - "If you liked {x}, you might enjoy these:"
  - "In the spirit of {x}:"
like_unknown:
  - "I don't know {x} well enough to match it — what do you like about it? Funny, exciting, fantasy, something true?"
  - "Hmm, {x} isn't one I know. What kind is it — funny, thrilling, sci-fi, romantic?"
suggest_ok:
  - "A {x} sounds like a great idea! Enjoy it."
  - "Ooh, a {x} — good call. You deserve it."
  - "I'd say yes to a {x}! Tell me how it was."
slept_good:
  - "Oh, that's the best start to a day! Got anything nice planned?"
  - "Love that — a good night's sleep makes everything easier. What's on today?"
slept_bad:
  - "Ugh, rough nights make everything harder. Was something on your mind? I can give you a few tips for tonight if you like."
  - "Oh no — that drags the whole day down. Want a few tricks that help with sleep tonight?"
will_they:
  - "Honestly, I can't know that — nobody really can. What I do know: you'll be okay either way, even if it doesn't feel like it now. What would you want, if you're really honest with yourself?"
  - "I wish I could tell you. It's normal to hope for that, especially so soon. Whatever happens, try to look after yourself first — how are you sleeping and eating at the moment?"
bot_likes:
  - "Plenty, in my own way! I love reading about space, octopuses and old recipes — and I really like conversations like this one. What about you, what do you enjoy?"
  - "I'd say reading — about anything, really: history, animals, how things work. And puzzles. What do you like doing?"
which_one:
  - "Which one — {x}?"
  - "Sure! Which one do you mean: {x}?"
dread_dentist:
  - "Totally get it — hardly anyone likes that chair. It'll be over before you know it, and you'll be glad it's done. Maybe plan something nice for afterwards?"
  - "You're not alone, most people feel that way. Tell them if you're nervous — they're used to it and can take it slowly. Treat yourself afterwards!"
bday_yesterday:
  - "Happy belated birthday! 🎂 I hope it was a good one. I've noted it: {x}."
  - "Oh, happy belated birthday! 🎉 Did you do anything nice? I'll remember {x}."
bday_today:
  - "Happy birthday! 🎂 I hope you get spoiled today. I've noted it: {x}."
  - "It's your birthday? Happy birthday! 🎉 Any plans to celebrate? I'll remember {x}."
bday_tomorrow:
  - "Your birthday's tomorrow? Exciting! 🎂 Got any plans? I've noted {x}."
turned:
  - "Happy birthday! 🎉 {x} — how does it feel?"
  - "{x}! Congratulations 🎂 Did you celebrate?"
food_pick:
  - "{X} sounds perfect! Ordering in, or making it yourself?"
  - "Ooh, {x} — good call. Enjoy!"
feels_weird:
  - "That's totally normal — new things often feel a bit strange at first. What feels weirdest about it?"
  - "Makes sense! Give it a little time. What's the strange part for you?"
what_if_mad:
  - "That's a fair worry. But if you say it calmly — “I was a bit hurt, can we talk?” — a good friend will usually understand. And if she does get upset, that's a conversation worth having anyway."
  - "She might be surprised at first, sure. Starting with how you feel instead of blaming her makes that much less likely. You care about the friendship — that will come across."
will_try:
  - "Good luck — I'm rooting for you. Tell me how it goes!"
  - "That's brave. Whatever happens, you did the right thing by speaking up. Let me know how it went!"
hurt_by_person:
  - "Of course you do — being left out by someone close stings more than by anyone else. Do you know why it happened, or did it come out of nowhere?"
  - "That makes total sense. It hurts most when it's someone who matters to you. Have you two talked about it yet?"
learning:
  guitar:
    start: ["Oh nice, the {x}! How long have you been playing?", "That's awesome — the {x} is such a fun one. Acoustic or electric?"]
    pain: ["Totally normal at the start — your fingertips are building calluses. Short sessions (15–20 minutes) a few times a day help, and after 2–3 weeks it gets much better. Take a break if it really hurts."]
    hard: ["Everyone feels that at first — chord changes are clumsy for weeks, then suddenly they click. Practise just two chords back and forth for a few minutes a day; it adds up fast."]
    how_long: ["With 15–30 minutes a day, most people play simple songs after 2–3 months and feel fairly comfortable after about a year. Regular short practice beats long sessions once a week."]
    songs: ["Good beginner songs: “Knockin' on Heaven's Door” (G, D, Am, C), “Horse with No Name” (two chords!), “Stand by Me”, “Three Little Birds” and “Wonderwall” with a capo. Start with the one you like most — motivation matters more than difficulty."]
    tips: ["A few things that help: practise a little every day, use a metronome slowly, learn songs you love, and record yourself now and then — you'll hear the progress."]
  piano:
    start: ["Oh, lovely — the {x}! Are you learning with a teacher, an app or on your own?"]
    hard: ["That's normal — getting both hands to do different things is the hardest part. Practise each hand alone first, then together really slowly."]
    how_long: ["With regular practice (20–30 minutes a day), simple pieces are possible after a few months, and many people play comfortably after a year or two."]
    songs: ["Nice starter pieces: “Heart and Soul”, the first part of “Für Elise”, “Let It Be” (simplified), “River Flows in You” (easy version) and “Ode to Joy”."]
    tips: ["Practise slowly and with a steady rhythm, little and often, and learn to read simple sheet music early — it pays off later."]
  drums:
    start: ["Drums — that's so much fun! Do you have a kit at home or a practice pad?"]
    how_long: ["Basic rock beats come within a few weeks; playing along to songs comfortably usually takes a few months of regular practice."]
    tips: ["Use a metronome from day one, start slow, and protect your ears — earplugs make a big difference."]
  violin:
    start: ["The {x}! That's a beautiful instrument — and a brave choice. How's it going so far?"]
    how_long: ["Honestly, the violin takes patience: a clean sound often takes several months, and simple tunes sound nice after about a year."]
    tips: ["Practise in front of a mirror to check your bow, keep sessions short and regular, and tune before every practice."]
  ukulele:
    start: ["A {x}! Great choice — it's one of the friendliest instruments to start with. What made you pick it?"]
    how_long: ["The ukulele is quick to learn: many people play simple songs within a couple of weeks."]
    songs: ["Easy ukulele songs: “Riptide”, “I'm Yours”, “Somewhere Over the Rainbow” and “Stand by Me”."]
  language:
    start: ["{x}! That's great. What made you want to learn it — travel, work, someone special?", "Oh nice, {x}! How long have you been learning?"]
    hard: ["Every learner hits that wall — it usually means you're about to improve. Keep sessions short and daily, and don't be afraid of mistakes."]
    how_long: ["For everyday conversations, most people need roughly 6–12 months of regular practice. Languages close to English (Spanish, French, Italian) are usually quicker than Japanese or Arabic."]
    tips: ["Learn a few words every day, listen to podcasts or shows in {x}, speak out loud even if it feels silly, and try a language exchange partner."]
# "what should I see in Paris?": the classic sights, checked by hand (the Lite pack has no tourism articles)
sights:
  paris: "the Eiffel Tower, the Louvre, Notre-Dame, Montmartre with the Sacré-Cœur, and a walk along the Seine"
  london: "the British Museum, the Tower of London and Tower Bridge, Westminster with Big Ben, Buckingham Palace, and a walk along the South Bank"
  rome: "the Colosseum and the Roman Forum, the Pantheon, the Trevi Fountain, Vatican City with St Peter's and the Sistine Chapel"
  barcelona: "the Sagrada Família, Park Güell, the Gothic Quarter, La Rambla and Barceloneta beach"
  madrid: "the Prado, the Royal Palace, Retiro Park, Plaza Mayor and the Reina Sofía museum"
  berlin: "the Brandenburg Gate, the Reichstag dome, Museum Island, the East Side Gallery and the Holocaust Memorial"
  munich: "Marienplatz, the English Garden, Nymphenburg Palace, the Deutsches Museum and a beer garden"
  hamburg: "the Elbphilharmonie, the Speicherstadt, Miniatur Wunderland, the harbour and the Sunday fish market"
  amsterdam: "the canals (a boat tour is great), the Rijksmuseum, the Van Gogh Museum, the Anne Frank House and the Jordaan"
  vienna: "Schönbrunn Palace, St Stephen's Cathedral, the Hofburg, the Belvedere and a classic coffee house"
  prague: "Prague Castle, Charles Bridge, the Old Town Square with its astronomical clock, and the Jewish Quarter"
  budapest: "the Parliament building, Buda Castle, the Chain Bridge, the thermal baths and the ruin bars"
  lisbon: "the Alfama district, Belém Tower, the Jerónimos Monastery, tram 28 and the viewpoints over the city"
  venice: "St Mark's Square and Basilica, the Doge's Palace, the Rialto Bridge, a gondola ride and the islands of Murano and Burano"
  florence: "the Duomo, the Uffizi Gallery, Michelangelo's David at the Accademia, the Ponte Vecchio and Piazzale Michelangelo"
  milan: "the Duomo, Leonardo's Last Supper, the Galleria Vittorio Emanuele II, La Scala and the Navigli canals"
  athens: "the Acropolis with the Parthenon, the Acropolis Museum, the Plaka district and the Ancient Agora"
  istanbul: "the Hagia Sophia, the Blue Mosque, Topkapı Palace, the Grand Bazaar and a boat trip on the Bosphorus"
  dubai: "the Burj Khalifa, the Dubai Mall and fountain, the old souks, the desert and the Palm Jumeirah"
  new york: "Central Park, the Statue of Liberty, Times Square, the Metropolitan Museum of Art, the Brooklyn Bridge and the view from the Empire State Building"
  new york city: "Central Park, the Statue of Liberty, Times Square, the Metropolitan Museum of Art, the Brooklyn Bridge and the view from the Empire State Building"
  san francisco: "the Golden Gate Bridge, Alcatraz, the cable cars, Fisherman's Wharf and Golden Gate Park"
  los angeles: "Hollywood and the Walk of Fame, the Griffith Observatory, Santa Monica and Venice Beach, and the Getty Center"
  washington: "the National Mall, the Lincoln Memorial, the Capitol, the White House and the free Smithsonian museums"
  chicago: "Millennium Park and the Bean, the Art Institute, a river architecture cruise and the Willis Tower skydeck"
  tokyo: "Shibuya Crossing, the Sensō-ji temple in Asakusa, the Meiji Shrine, Shinjuku at night and the Tsukiji outer market"
  kyoto: "Fushimi Inari's thousands of red gates, Kinkaku-ji (the Golden Pavilion), the Arashiyama bamboo grove and the Gion district"
  seoul: "Gyeongbokgung Palace, Bukchon Hanok Village, Myeongdong, N Seoul Tower and a night market"
  beijing: "the Great Wall, the Forbidden City, Tiananmen Square, the Temple of Heaven and the Summer Palace"
  hong kong: "Victoria Peak, the Star Ferry, the harbour skyline at night, Tian Tan Buddha and the night markets"
  singapore: "Gardens by the Bay, Marina Bay Sands, the hawker centres, Sentosa and Chinatown"
  bangkok: "the Grand Palace, Wat Pho with the reclining Buddha, Wat Arun, the floating markets and Chatuchak market"
  sydney: "the Opera House, the Harbour Bridge, Bondi Beach, the coastal walk to Coogee and a ferry to Manly"
  cairo: "the Pyramids of Giza and the Sphinx, the Egyptian Museum, Khan el-Khalili bazaar and a Nile cruise"
  marrakech: "Jemaa el-Fnaa square, the souks, the Majorelle Garden, the Bahia Palace and the Koutoubia Mosque"
  cape town: "Table Mountain, the V&A Waterfront, Robben Island, Cape Point and the penguins at Boulders Beach"
  rio de janeiro: "Christ the Redeemer, Sugarloaf Mountain, Copacabana and Ipanema beaches, and the Selarón Steps"
  mexico city: "the Zócalo, the National Museum of Anthropology, Frida Kahlo's Blue House, Chapultepec and the pyramids of Teotihuacán nearby"
  toronto: "the CN Tower, the Distillery District, Kensington Market, the Royal Ontario Museum and a day trip to Niagara Falls"
  copenhagen: "Nyhavn, Tivoli Gardens, the Little Mermaid, Christiansborg Palace and a bike ride around the city"
  stockholm: "Gamla Stan (the old town), the Vasa Museum, the Royal Palace, Skansen and a boat trip through the archipelago"
  edinburgh: "Edinburgh Castle, the Royal Mile, Arthur's Seat, Holyrood Palace and the Old Town closes"
  dublin: "Trinity College and the Book of Kells, the Guinness Storehouse, Temple Bar, St Patrick's Cathedral and a walk in Phoenix Park"
  japan: "Tokyo, the temples of Kyoto, Mount Fuji, the deer park in Nara, Hiroshima's Peace Memorial and the street food of Osaka"
  italy: "Rome's ancient sites, Florence's art, the canals of Venice, the Amalfi Coast and Lake Como"
  france: "Paris, the castles of the Loire Valley, Mont-Saint-Michel, Provence and the Côte d'Azur"
  spain: "Barcelona's Gaudí buildings, Madrid's museums, the Alhambra in Granada, Seville and the beaches of the south"
  greece: "the Acropolis in Athens, Santorini, Mykonos, Delphi and the monasteries of Meteora"
  portugal: "Lisbon, Porto and the Douro Valley, Sintra's palaces and the beaches of the Algarve"
  germany: "Berlin, Munich and the Bavarian Alps, Neuschwanstein Castle, the Rhine Valley and Hamburg"
  thailand: "Bangkok's temples, Chiang Mai, the islands like Koh Phi Phi and Koh Samui, and the beaches of Krabi"
  egypt: "the Pyramids of Giza, Luxor's temples and the Valley of the Kings, a Nile cruise and Abu Simbel"
sights_lead:
  - "In {x}, don't miss {y}."
  - "The classics in {x}: {y}."
