  offer: ["Want a few tips on what usually helps?", "Should I tell you what usually helps in a situation like this?"]
  advice_head: ["Here's what usually helps:", "A few things that usually help:"]
  advice:
    DAMAGE: "• Stop using it for now if it might get worse.\n• Check whether it's still under warranty or covered by insurance.\n• Take a photo of the damage.\n• Ask a repair shop for a quote — often a repair is cheaper than you'd think."
    DAMAGE.STAIN: "• Blot it right away with a clean cloth — don't rub, that spreads it.\n• Rinse from the back with cold water (hot water sets many stains).\n• Then a little washing-up liquid or a stain remover, tested on a hidden spot first.\n• For upholstery, check the care label; for delicate fabrics, a dry cleaner is the safer bet."
    DAMAGE.DEVICE: "• If liquid got in or it smells burnt: switch it off and unplug it right away — don't switch it on to test it.\n• Back up your data as soon as it runs again.\n• Check the warranty, your insurance and the manufacturer's repair service.\n• A repair shop can usually give you a free quote."
    DAMAGE.VEHICLE: "• Get yourself and the vehicle out of traffic first — hazard lights on, warning triangle if you have one.\n• Call your breakdown service or insurance if you can't fix it safely yourself.\n• Take photos if someone else was involved.\n• Get it checked at a garage before driving far."
    DAMAGE.BUILDPART: "• Limit the damage first: catch water, move valuables, switch off power or water to that area if needed.\n• Tell your landlord or property management (use their emergency number if it's urgent).\n• Take photos for the insurance.\n• Don't try risky repairs yourself — a professional is worth it here."
    DAMAGE.CLOTHING: "• Act quickly: blot (don't rub) any stain and rinse it with cold water.\n• Check the care label before using hot water or chemicals.\n• For tears, a tailor or repair café can often fix it cheaply."
    DAMAGE.FURNITURE: "• Blot spills right away (don't rub) and test any cleaner on a hidden spot first.\n• Small scratches and dents can often be fixed with simple repair kits.\n• Check the warranty or your household insurance for bigger damage."
    INJURY: "• Cool it with a cold pack or a cold cloth (not ice directly on the skin) for 10–15 minutes.\n• Rest it and keep it raised if it's swollen.\n• Clean small wounds with clean water and cover them.\n• Get it checked if it's very painful, can't be moved, looks deformed or doesn't improve in a few days. Call emergency services for heavy bleeding, breathing problems or loss of consciousness."
    INJURY.cut: "• Press a clean cloth on it until the bleeding stops.\n• Rinse it with clean water, then cover it with a plaster or dressing.\n• Get it seen if it's deep or gaping, won't stop bleeding after 10 minutes, or if your tetanus shot isn't up to date."
    INJURY.burn: "• Cool it under lukewarm running water for 10–20 minutes — no ice, butter or creams.\n• Take off rings or tight things near it.\n• Cover it loosely with a clean, non-fluffy dressing.\n• Get help for burns bigger than your palm, on the face, hands or joints, or with blisters that look deep."
    INJURY.sting: "• Remove a stinger if there is one (scrape it out sideways).\n• Wash the spot and cool it.\n• An antihistamine or cooling gel from the pharmacy helps with itching and swelling.\n• Call emergency services right away if you have trouble breathing, swelling of the face or throat, or feel dizzy."
    INJURY.sprain: "• Rest it, cool it for 10–15 minutes at a time, and keep it raised.\n• A light compression bandage can help with swelling.\n• Get it checked if you can't put weight on it, it looks deformed, or it's not better after a few days."
    INJURY.head: "• Rest and keep an eye on how you feel.\n• Get medical help right away for vomiting, confusion, worsening headache, drowsiness, unequal pupils or loss of consciousness."
    INJURY.bite: "• Wash the bite thoroughly with soap and water.\n• Cover it with a clean dressing.\n• Animal bites often get infected — see a doctor, especially for deep bites, bites on the hand or face, or if your tetanus shot isn't current."
    ILLNESS: "• Rest, drink plenty of fluids and eat light food.\n• A pharmacist can recommend something for the symptoms.\n• See a doctor if it lasts more than a few days, keeps getting worse, or you have a high fever, trouble breathing or severe pain."
    ILLNESS.child: "• Keep them comfortable and make sure they drink enough.\n• Check their temperature regularly.\n• Call the pediatrician if they're very young, the fever is high or lasts more than two to three days, they drink very little, are unusually drowsy, or you're simply worried — that's what they're there for."
    ILLNESS.pet: "• Keep an eye on whether it's eating, drinking and behaving normally.\n• Remove anything it might have eaten.\n• Call the vet if it happens repeatedly, there's blood, it's lethargic, or it may have eaten something poisonous."
    LOSS: "• Retrace your steps and check the last places you had it — pockets, bags and the car too.\n• Call or ask places you visited; check lost-and-found.\n• If it's a bank card or ID: block or report it right away.\n• For phones: try locating it with the find-my-device feature."
    THEFT: "• Block bank cards and change passwords right away if they're affected.\n• Report it to the police — you'll need the report for insurance.\n• Check whether your household or travel insurance covers it.\n• Write down serial numbers or descriptions while you remember them."
    CONFLICT: "• Give yourself a moment to calm down before you talk.\n• Talk about how it made you feel (\"I felt …\") rather than blaming.\n• Listen to their side too — there may be something you don't know.\n• If they need space, give it — but let them know the door is open."
    FAILURE: "• Let yourself be disappointed — that's normal.\n• Look at what went wrong without being too hard on yourself.\n• Find out about the next chance: a retake, another application, another try.\n• Talk to someone who has been through it — it helps to hear it's common."
    MONEY: "• Check the bill or the costs carefully — mistakes happen.\n• Ask about paying in instalments; most companies agree if you ask early.\n• Write down your monthly income and costs to see where you can save.\n• Free debt or budget counselling can help if it gets too much."
    DELAY: "• Check your options: the next connection, rebooking, or another way to get there.\n• Let people know you'll be late.\n• Keep receipts and tickets — for cancellations and long delays you may be entitled to compensation."
    WORRY: "• Write down what exactly worries you — it often feels smaller on paper.\n• Prepare what you can, and let go of what you can't control.\n• Breathe slowly in for four, out for six — it really calms the body.\n• Talk to someone you trust."
    FEEL_NEG: "• Be kind to yourself today — it's okay to have a bad day.\n• Get some fresh air or move a little, even a short walk.\n• Message or call someone you like.\n• If the feeling stays for weeks, talking to a doctor or counsellor really helps."
    PLAN: "• Prepare the essentials the day before, so you're not rushed.\n• Get enough sleep the night before.\n• Plan a little extra time.\n• And enjoy it — you've got this!"
