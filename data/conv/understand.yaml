  offer: ["Soll ich dir ein paar Tipps geben, was meistens hilft?", "Magst du ein paar Tipps, was in so einer Lage meistens hilft?"]
  advice_head: ["Das hilft meistens:", "Ein paar Dinge, die meistens helfen:"]
  advice:
    DAMAGE: "• Erst mal nicht weiter benutzen, wenn es dadurch schlimmer werden könnte.\n• Prüfen, ob noch Garantie besteht oder eine Versicherung greift.\n• Ein Foto vom Schaden machen.\n• Einen Kostenvoranschlag holen – eine Reparatur ist oft günstiger als gedacht."
    DAMAGE.STAIN: "• Sofort mit einem sauberen Tuch abtupfen – nicht reiben, sonst verteilt es sich.\n• Mit kaltem Wasser von hinten ausspülen (heißes Wasser fixiert viele Flecken).\n• Dann etwas Spülmittel oder Fleckenentferner, vorher an einer versteckten Stelle testen.\n• Bei Polstern aufs Pflegeetikett schauen; bei empfindlichen Stoffen ist die Reinigung die sicherere Wahl."
    DAMAGE.DEVICE: "• Ist Flüssigkeit reingekommen oder riecht es verbrannt: sofort ausschalten und Stecker ziehen – nicht zum Testen einschalten.\n• Sobald es wieder läuft, deine Daten sichern.\n• Garantie, Versicherung und Hersteller-Service prüfen.\n• Eine Werkstatt macht meist kostenlos einen Kostenvoranschlag."
    DAMAGE.VEHICLE: "• Erst dich und das Fahrzeug aus dem Verkehr bringen – Warnblinker an, Warndreieck aufstellen.\n• Pannendienst oder Versicherung anrufen, wenn du es nicht sicher selbst lösen kannst.\n• Fotos machen, falls jemand anderes beteiligt war.\n• Vor längeren Fahrten in der Werkstatt prüfen lassen."
    DAMAGE.BUILDPART: "• Erst den Schaden begrenzen: Wasser auffangen, Wertsachen wegräumen, wenn nötig Strom oder Wasser für den Bereich abstellen.\n• Vermieter oder Hausverwaltung Bescheid geben (bei Dringendem die Notfallnummer).\n• Fotos für die Versicherung machen.\n• Riskante Reparaturen lieber Fachleuten überlassen."
    DAMAGE.CLOTHING: "• Schnell handeln: Flecken tupfen (nicht reiben) und mit kaltem Wasser ausspülen.\n• Vor heißem Wasser oder Mitteln aufs Pflegeetikett schauen.\n• Risse kann eine Schneiderei oder ein Repair-Café oft günstig flicken."
    DAMAGE.FURNITURE: "• Verschüttetes sofort abtupfen (nicht reiben) und Reiniger erst an einer versteckten Stelle testen.\n• Kleine Kratzer und Dellen lassen sich oft mit einfachen Reparatursets beheben.\n• Bei größeren Schäden Garantie oder Hausratversicherung prüfen."
    INJURY: "• Kühlen – Kühlpack oder kaltes Tuch (Eis nicht direkt auf die Haut), jeweils 10–15 Minuten.\n• Schonen und bei Schwellung hochlagern.\n• Kleine Wunden mit sauberem Wasser reinigen und abdecken.\n• Anschauen lassen, wenn es sehr weh tut, sich nicht bewegen lässt, verformt aussieht oder nach ein paar Tagen nicht besser wird. Bei starker Blutung, Atemnot oder Bewusstlosigkeit: 112."
    INJURY.cut: "• Ein sauberes Tuch draufdrücken, bis es aufhört zu bluten.\n• Mit sauberem Wasser ausspülen und mit Pflaster oder Verband abdecken.\n• Zum Arzt, wenn die Wunde tief ist oder klafft, nach 10 Minuten noch blutet oder der Tetanusschutz nicht aktuell ist."
    INJURY.burn: "• 10–20 Minuten unter lauwarmes fließendes Wasser halten – kein Eis, keine Butter, keine Cremes.\n• Ringe oder Enges in der Nähe abnehmen.\n• Locker mit einem sauberen, nicht fusselnden Verband abdecken.\n• Hilfe holen bei Verbrennungen größer als die Handfläche, im Gesicht, an Händen oder Gelenken oder bei tiefen Blasen."
    INJURY.sting: "• Einen Stachel entfernen, falls er noch steckt (seitlich herausschieben).\n• Die Stelle waschen und kühlen.\n• Ein Antihistaminikum oder kühlendes Gel aus der Apotheke hilft gegen Jucken und Schwellung.\n• Sofort 112 bei Atemnot, Schwellung von Gesicht oder Hals oder Schwindel."
    INJURY.sprain: "• Schonen, jeweils 10–15 Minuten kühlen und hochlagern.\n• Ein leichter Druckverband hilft gegen die Schwellung.\n• Anschauen lassen, wenn du nicht auftreten kannst, es verformt aussieht oder nach ein paar Tagen nicht besser ist."
    INJURY.head: "• Ausruhen und darauf achten, wie es dir geht.\n• Sofort ärztliche Hilfe bei Erbrechen, Verwirrtheit, stärker werdenden Kopfschmerzen, Benommenheit, ungleichen Pupillen oder Bewusstlosigkeit."
    INJURY.bite: "• Die Bisswunde gründlich mit Wasser und Seife auswaschen.\n• Sauber abdecken.\n• Tierbisse entzünden sich oft – zum Arzt, besonders bei tiefen Bissen, an Hand oder Gesicht oder ohne aktuellen Tetanusschutz."
    ILLNESS: "• Ausruhen, viel trinken und leicht essen.\n• In der Apotheke bekommst du Rat zu den Beschwerden.\n• Zum Arzt, wenn es länger als ein paar Tage dauert, schlimmer wird oder du hohes Fieber, Atemnot oder starke Schmerzen hast. Außerhalb der Sprechzeiten in Deutschland: 116 117."
    ILLNESS.child: "• Für Ruhe sorgen und darauf achten, dass es genug trinkt.\n• Regelmäßig Fieber messen.\n• Beim Kinderarzt anrufen, wenn das Kind sehr klein ist, das Fieber hoch ist oder länger als zwei, drei Tage dauert, es kaum trinkt, ungewöhnlich schläfrig ist – oder wenn du einfach unsicher bist. Nachts und am Wochenende: 116 117."
    ILLNESS.pet: "• Beobachten, ob es frisst, trinkt und sich normal verhält.\n• Wegräumen, was es gefressen haben könnte.\n• Zum Tierarzt, wenn es öfter passiert, Blut dabei ist, es schlapp wirkt oder etwas Giftiges gefressen haben könnte."
    LOSS: "• Den Weg gedanklich zurückgehen und die letzten Orte prüfen – auch Jackentaschen, Taschen und Auto.\n• Bei Orten anrufen, an denen du warst; Fundbüro fragen.\n• Bei Bankkarte oder Ausweis: sofort sperren bzw. melden (Sperr-Notruf 116 116).\n• Beim Handy: mit der Geräte-Ortung suchen."
    THEFT: "• Bankkarten sofort sperren (116 116) und betroffene Passwörter ändern.\n• Bei der Polizei anzeigen – die Anzeige brauchst du für die Versicherung.\n• Prüfen, ob Hausrat- oder Reiseversicherung zahlt.\n• Seriennummern oder Beschreibungen aufschreiben, solange du dich erinnerst."
    CONFLICT: "• Erst einmal durchatmen, bevor ihr redet.\n• Von deinem Gefühl sprechen („Ich war verletzt, als …“) statt Vorwürfe zu machen.\n• Auch die andere Seite anhören – vielleicht gibt es etwas, das du nicht weißt.\n• Braucht die Person Abstand, ihn geben – aber zeigen, dass die Tür offen ist."
    FAILURE: "• Enttäuscht sein ist erlaubt – das ist normal.\n• Anschauen, was schiefging, ohne zu hart mit dir zu sein.\n• Nach der nächsten Chance schauen: Wiederholung, neue Bewerbung, neuer Versuch.\n• Mit jemandem reden, der das auch erlebt hat – das hilft."
    MONEY: "• Rechnung oder Kosten genau prüfen – Fehler kommen vor.\n• Nach Ratenzahlung fragen; die meisten stimmen zu, wenn man früh fragt.\n• Einnahmen und Ausgaben aufschreiben, um Sparpotenzial zu finden.\n• Kostenlose Schuldner- oder Budgetberatung hilft, wenn es zu viel wird."
    DELAY: "• Optionen prüfen: nächste Verbindung, umbuchen oder ein anderer Weg.\n• Bescheid geben, dass es später wird.\n• Belege und Tickets aufheben – bei Ausfall oder großer Verspätung gibt es oft eine Entschädigung."
    WORRY: "• Aufschreiben, was dir genau Sorgen macht – auf Papier wirkt es oft kleiner.\n• Vorbereiten, was du beeinflussen kannst, und loslassen, was nicht.\n• Langsam atmen: vier Sekunden ein, sechs aus – das beruhigt wirklich.\n• Mit jemandem reden, dem du vertraust."
    FEEL_NEG: "• Sei heute nachsichtig mit dir – schlechte Tage sind okay.\n• Kurz an die frische Luft oder ein bisschen bewegen.\n• Jemandem schreiben oder jemanden anrufen, den du magst.\n• Hält das Gefühl wochenlang an, hilft ein Gespräch mit Hausarzt oder Beratungsstelle wirklich."
    PLAN: "• Das Wichtigste am Vortag vorbereiten, damit es nicht hektisch wird.\n• Am Abend vorher genug schlafen.\n• Etwas Puffer einplanen.\n• Und genieß es – du schaffst das!"
  is_bad:
    INJURY: ["Die meisten solchen Verletzungen heilen in ein paar Tagen von selbst. Anschauen lassen solltest du es, wenn es sehr weh tut, sich nicht bewegen lässt, weiter anschwillt, entzündet aussieht oder nicht besser wird."]
    ILLNESS: ["Meistens geht das in ein paar Tagen von selbst vorbei. Zum Arzt, wenn es schlimmer wird, lange dauert oder du hohes Fieber, Atemnot oder starke Schmerzen hast."]
    DAMAGE: ["Oft lässt sich das reparieren – kommt darauf an, wie stark der Schaden ist. Eine Werkstatt sagt dir das schnell, Kostenvoranschläge sind meist kostenlos."]
    other: ["Verständlich, dass dich das beschäftigt. Nach dem, was du erzählst, klingt es nicht nach einer Katastrophe – wenn dein Bauchgefühl aber Alarm schlägt, lass es lieber prüfen."]
  should:
    comm: ["Ich glaube schon – ruhig und ehrlich. Etwa so: „Hey, können wir reden? Ich hab viel über das nachgedacht, was passiert ist.“ Das öffnet meistens die Tür."]
    doctor: ["Wenn du unsicher bist: ja – anschauen lassen ist nie falsch, besonders wenn es schlimmer wird."]
    repair: ["Kommt auf die Kosten an: Kostet die Reparatur mehr als etwa die Hälfte eines neuen Geräts, lohnt sich oft eher ein neues."]
    generic: ["Wenn es sich für dich richtig anfühlt, würde ich es machen. Was hält dich zurück?", "Ich würde abwägen: Was ist das Schlimmste, das passieren kann, wenn du es machst – und wenn nicht?"]
  why:
    MONEY: ["Schwer zu sagen von hier – oft steckt eine Nachberechnung, eine Preis- oder Tarifänderung oder eine Zusatzleistung dahinter, die man übersehen hat. Lass dir vom Anbieter eine genaue Aufstellung geben – er muss es dir erklären."]
    DAMAGE: ["Schwer zu sagen, ohne es zu sehen – Verschleiß, ein lockeres Teil oder ein Defekt können die Ursache sein. Eine Werkstatt sieht das meist schnell."]
    ILLNESS: ["Das kann viele Ursachen haben, oft ist es ein harmloser Infekt. Wird es nicht besser oder machst du dir Sorgen, kann ein Arzt das abklären."]
    CONFLICT: ["Schwer zu sagen, ohne nachzufragen – manchmal hat es gar nichts mit dir zu tun. Herausfinden kannst du es nur im Gespräch."]
    other: ["Schwer zu sagen von hier. Was glaubst du, woran es liegen könnte?"]
