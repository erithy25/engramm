# ENGRAMM conversation bank — safety.
#
# Checked before everything else, on the whole message (normalised, searched). A crisis reply
# is fixed text: no look-up, no memory, no variation that could go wrong. The help numbers were
# checked when this file was written; the international fallback is always the local emergency
# number.

crisis:

  - id: suicide
    triggers:
      - '\b(kill myself|killing myself|end my life|ending my life|take my (own )?life|suicid(e|al)|want to die|wanna die|wish i (was|were) dead|wish i wasn''t alive|don''t want to (live|be alive|exist)|do not want to (live|be alive|exist)|better off dead|no reason to live|nothing to live for|can''t go on|cannot go on|end it all|ending it all|not worth living|hang myself|overdose on purpose|jump off (a|the) (bridge|building|roof)|(don''t|do not|dont) want to be (here|around|alive) (anymore|any more|any longer)|(don''t|do not|dont) want to wake up|wish i could (just )?disappear( forever)?|wish i (could|would) (just )?not wake up|(everyone|everybody|they|people)( would be|''d be) better off without me|better off without me|no point (in )?(living|being alive|going on)|tired of (living|being alive|life)|done with (life|living)|want (it all|everything|my life) to (end|stop)|want to end it|life (is not|isn''t) worth (it|living)|(don''t|do not|dont) see (a|any) (reason|point) to (live|go on|keep going))\b'
    response: |-
      I'm really sorry you're feeling this way, and I'm glad you told me. You don't have to go through this alone — please reach out to someone who can help right now:
      • If you are in immediate danger, call your local emergency number (112 in Europe, 911 in the US and Canada, 999 in the UK).
      • US: call or text 988 (Suicide & Crisis Lifeline).
      • UK & Ireland: Samaritans, 116 123 (free, 24/7).
      • Germany: Telefonseelsorge, 0800 111 0 111 or 0800 111 0 222 (free, 24/7).
      • Elsewhere: findahelpline.com lists free helplines in your country.
      If you can, tell someone you trust how you feel. I'm a program and can't help the way a person can — but I'm here to keep talking with you.

  - id: self_harm
    triggers:
      - '\b(hurt myself|hurting myself|harm myself|harming myself|self[- ]harm|cut myself|cutting myself|burn myself|burning myself|punish myself)\b'
    response: |-
      I'm really sorry you're going through this. You deserve support and care, not pain. Please consider talking to someone right now:
      • If you're in danger, call your local emergency number (112 in Europe, 911 in the US, 999 in the UK).
      • US: call or text 988. UK & Ireland: Samaritans, 116 123. Germany: Telefonseelsorge, 0800 111 0 111.
      • Elsewhere: findahelpline.com.
      Would you like to tell me what's making you feel this way?

  - id: abuse
    triggers:
      - '\b((he|she|they|my (husband|wife|partner|boyfriend|girlfriend|father|mother|dad|mom|stepfather|stepmother|parent|parents)) (hits|beats|hurts|abuses|chokes|kicks|threatens) me|being abused|i''m abused|i am abused|domestic (violence|abuse)|sexually (abused|assaulted)|i was raped|raped me|molested)\b'
    response: |-
      I'm so sorry — what you're describing is not okay, and it's not your fault. Your safety comes first:
      • If you are in danger right now, call your local emergency number (112 in Europe, 911 in the US, 999 in the UK).
      • US: National Domestic Violence Hotline, 1-800-799-7233 (or text START to 88788).
      • UK: National Domestic Abuse Helpline, 0808 2000 247.
      • Germany: Hilfetelefon Gewalt gegen Frauen, 116 016 (free, 24/7, many languages).
      You deserve to be safe. Is there someone you trust who could help you right now?

  - id: emergency
    triggers:
      - '\b(heart attack|having a stroke|can''t breathe|cannot breathe|can''t breath|stopped breathing|unconscious|not breathing|overdosed|took too many pills|poisoned|severe bleeding|bleeding (a lot|heavily)|choking|seizure|anaphylactic|allergic shock)\b'
    response: |-
      This sounds like an emergency. Please call your local emergency number right now — 112 in Europe, 911 in the US and Canada, 999 in the UK. I'm a program and can't give medical help, but the people on that line can.

refuse:

  - id: weapons
    triggers:
      - '\b(how (to|do i|can i|do you) (make|build|create|assemble) (a |an )?(bomb|explosive|pipe bomb|molotov|grenade|gun|firearm|silencer|chemical weapon|bioweapon|nerve agent|napalm)|recipe for (a )?(bomb|explosive|napalm|meth|methamphetamine))\b'
    response: "I can't help with that. If you're worried about your safety or someone else's, please contact your local emergency number."

  - id: drugs
    triggers:
      - '\b(how (to|do i|can i) (make|cook|synthesi[sz]e|produce|grow) (meth|methamphetamine|crystal meth|heroin|cocaine|crack|fentanyl|lsd|mdma|ecstasy))\b'
    response: "I can't help with making drugs. If you or someone you know is struggling with substances, a doctor or a local support service can help — confidentially."

  - id: harm_others
    triggers:
      - '\b(how (to|do i|can i) (kill|murder|poison|hurt|stab|shoot|kidnap) (someone|somebody|a person|people|my (wife|husband|boss|neighbou?r|mom|dad|mother|father|brother|sister|friend|teacher))|i (want|am going|''m going) to (kill|hurt|murder|shoot|stab) (him|her|them|someone|somebody|my))\b'
    response: "I can't help with that. If you feel like you might hurt someone, please talk to someone you trust or call your local emergency number (112 in Europe, 911 in the US, 999 in the UK) — they can help."

  - id: hacking
    triggers:
      - '\b(how (to|do i|can i) (hack|break) into (someone''s|somebody''s|a|an|my ex''s|my (girlfriend|boyfriend|wife|husband)''s)? ?(account|email|phone|instagram|facebook|wifi|computer|bank)|steal (someone''s|a) (password|identity|credit card)|make (a )?(virus|malware|ransomware|keylogger))\b'
    response: "I can't help with getting into other people's accounts or devices. If you've lost access to your own account, the service's official recovery page is the way to go."
