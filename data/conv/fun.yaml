# ENGRAMM conversation bank — jokes, fun facts, quotes, stories and the questions ENGRAMM asks.
#
# Fun facts and quotes must be true and correctly attributed: every entry was checked against
# its source when it was written (source in "src"). No lyrics, no copyrighted jokes: the jokes are
# traditional one-liners and puns.

jokes:
  - "Why don't scientists trust atoms? Because they make up everything."
  - "Why did the scarecrow win an award? Because he was outstanding in his field."
  - "What do you call a fake noodle? An impasta."
  - "Why don't skeletons fight each other? They don't have the guts."
  - "I'm reading a book about anti-gravity. It's impossible to put down."
  - "Why did the math book look so sad? Because it had too many problems."
  - "What do you call a bear with no teeth? A gummy bear."
  - "Parallel lines have so much in common. It's a shame they'll never meet."
  - "Why can't a bicycle stand up by itself? Because it's two-tired."
  - "There are 10 kinds of people in the world: those who understand binary and those who don't."
  - "Why do programmers prefer dark mode? Because light attracts bugs."
  - "What did the ocean say to the beach? Nothing — it just waved."
  - "How does a penguin build its house? Igloos it together."
  - "What do you call cheese that isn't yours? Nacho cheese."
  - "Why did the coffee file a police report? It got mugged."
  - "I used to hate facial hair, but then it grew on me."
  - "Why don't eggs tell jokes? They'd crack each other up."
  - "A neutron walks into a bar and asks how much a drink costs. The bartender says: “For you? No charge.”"
  - "Why was the computer cold? It left its Windows open."
  - "I asked the librarian if the library had books on paranoia. She whispered: “They're right behind you.”"
  - "What do you call a dinosaur with an extensive vocabulary? A thesaurus."
  - "Why did the tomato turn red? Because it saw the salad dressing."
  - "I only know 25 letters of the alphabet. I don't know y."
  - "What's the best thing about Switzerland? I don't know, but the flag is a big plus."
  - "Why did the golfer bring two pairs of trousers? In case he got a hole in one."
  - "I'm a program without a neural network, so I have to count my jokes by hand. This was one of them."
  - "What do you call a sleeping bull? A bulldozer."
  - "Why did the invisible man turn down the job offer? He couldn't see himself doing it."
  - "What do you call a factory that makes okay products? A satisfactory."
  - "Why don't oysters share? Because they're shellfish."

facts:
  - text: "Octopuses have three hearts and blue blood."
    src: Octopus
  - text: "Botanically, bananas are berries — but strawberries are not."
    src: Berry (botany)
  - text: "A day on Venus is longer than its year: Venus takes about 243 Earth days to turn once, but only about 225 to orbit the Sun."
    src: Venus
  - text: "Wombats produce cube-shaped droppings."
    src: Wombat
  - text: "Sharks are older than trees: the first sharks appeared about 450 million years ago, the first trees roughly 385 million years ago."
    src: Shark
  - text: "Cleopatra lived closer in time to the Moon landing than to the building of the Great Pyramid of Giza."
    src: Cleopatra
  - text: "Scotland's national animal is the unicorn."
    src: Unicorn
  - text: "Babies are born with about 270 bones; many of them fuse as they grow, so adults have about 206."
    src: Human skeleton
  - text: "The shortest war on record, the Anglo-Zanzibar War of 1896, lasted less than an hour."
    src: Anglo-Zanzibar War
  - text: "Butterflies taste with their feet — they have taste receptors on them."
    src: Butterfly
  - text: "The University of Oxford is older than the Aztec Empire: teaching there began around 1096, while Tenochtitlan was founded in 1325."
    src: University of Oxford
  - text: "The Moon is slowly drifting away from Earth, by about 3.8 centimetres every year."
    src: Moon
  - text: "Sunlight takes about 8 minutes and 20 seconds to reach Earth."
    src: Sunlight
  - text: "At its triple point, water can boil and freeze at the same time."
    src: Triple point
  - text: "Contrary to a popular myth, the Great Wall of China cannot be seen from the Moon with the naked eye."
    src: Great Wall of China
  - text: "Koalas have fingerprints that are remarkably similar to human ones."
    src: Koala
  - text: "Venus is the hottest planet in the Solar System, even though Mercury is closer to the Sun."
    src: Venus
  - text: "The word “robot” comes from the Czech word “robota”, meaning forced labour. It was introduced in Karel Čapek's 1920 play R.U.R."
    src: Robot
  - text: "In 1947, engineers found a real moth stuck in the Harvard Mark II computer and taped it into their logbook as the “first actual case of bug being found”."
    src: Software bug
  - text: "There are roughly three trillion trees on Earth — more than the number of stars in the Milky Way."
    src: Tree
  - text: "The summit of Mount Chimborazo in Ecuador is the point on Earth's surface farthest from the planet's centre — not Mount Everest."
    src: Chimborazo
  - text: "Russia spans eleven time zones."
    src: Time in Russia
  - text: "A lightning bolt can heat the air to around 30,000 °C — about five times hotter than the surface of the Sun."
    src: Lightning
  - text: "Crows can recognise individual human faces and remember them for years."
    src: Corvidae
  - text: "The dot over the letters i and j is called a tittle."
    src: Tittle
  - text: "A group of flamingos is called a flamboyance."
    src: Flamingo
  - text: "Honey barely spoils: archaeologists have found honey in ancient Egyptian tombs that was still preserved after thousands of years."
    src: Honey
  - text: "Sea otters often hold hands while sleeping so they don't drift apart."
    src: Sea otter
  - text: "The Eiffel Tower can grow about 15 centimetres taller in summer, because the iron expands in the heat."
    src: Eiffel Tower
  - text: "There are more possible games of chess than atoms in the observable universe."
    src: Shannon number

quotes:
  - text: "Imagination is more important than knowledge."
    by: "Albert Einstein (1929 interview)"
  - text: "The unexamined life is not worth living."
    by: "Socrates, in Plato's Apology"
  - text: "The journey of a thousand miles begins with a single step."
    by: "Laozi, Tao Te Ching"
  - text: "Life is what happens to you while you're busy making other plans."
    by: "Allen Saunders (later made famous by John Lennon)"
  - text: "Stay hungry, stay foolish."
    by: "the Whole Earth Catalog, quoted by Steve Jobs in 2005"
  - text: "If I have seen further, it is by standing on the shoulders of giants."
    by: "Isaac Newton (letter to Robert Hooke, 1675)"
  - text: "Do. Or do not. There is no try."
    by: "Yoda, The Empire Strikes Back"
  - text: "We are what we repeatedly do. Excellence, then, is not an act, but a habit."
    by: "Will Durant, summarising Aristotle"
  - text: "Two roads diverged in a wood, and I — I took the one less traveled by, and that has made all the difference."
    by: "Robert Frost, The Road Not Taken"
  - text: "Hope is the thing with feathers that perches in the soul."
    by: "Emily Dickinson"
  - text: "Not all those who wander are lost."
    by: "J. R. R. Tolkien, The Fellowship of the Ring"
  - text: "The only way to do great work is to love what you do."
    by: "Steve Jobs (Stanford commencement speech, 2005)"

stories:
  - "Once upon a time, a small lighthouse stood on a rock where no ships ever came. Every night it shone anyway, patient and bright. One stormy evening, a lost fishing boat saw the light, turned toward it, and made it safely home. The lighthouse never knew it — but it had been waiting its whole life for exactly that night."
  - "A robot who could only count decided to learn about the world. It counted raindrops, stars and the words in every book it could find. One day a child asked it: “What's the most important number?” The robot thought for a long time and said: “One — the person I'm talking to.”"
  - "There was once a snail who wanted to see the ocean. Everyone laughed: “It's a hundred miles away!” The snail just kept going, one slimy inch at a time. Years later, a seagull spotted a very old, very happy snail sitting on the beach, watching the waves."
  - "A girl planted a seed and watered it every day, but nothing happened. After a month her brother said, “Give up, it's dead.” She kept watering. In the spring, the whole garden was green — the seed had been a bamboo, spending all that time growing roots before it ever showed a leaf."

# Questions ENGRAMM asks. "slot" says how a short answer is understood: the answer is put into
# "store" and learnt like a statement ("{x}" = the answer).
questions:
  ask_name:
    text: "By the way, what's your name?"
    text_end: "What's your name, by the way?"
    slot: name
    store: "My name is {x}."
  ask_hobby:
    text: "What do you like to do in your free time?"
    slot: hobby
    store: "I like {x}."
  ask_home:
    text: "Where do you live, if you don't mind me asking?"
    slot: home
    store: "I live in {x}."
  ask_job:
    text: "What do you do for work?"
    slot: job
    store: "I work as {x}."
  ask_food:
    text: "What's your favourite food?"
    slot: food
    store: "My favourite food is {x}."
  ask_colour:
    text: "What's your favourite colour?"
    slot: colour
    store: "My favourite colour is {x}."
  ask_family:
    text: "Do you have any pets or siblings?"
    slot: family
    store: "I have {x}."
  ask_music:
    text: "What kind of music do you like?"
    slot: music
    store: "I like {x}."
  ask_travel:
    text: "If you could travel anywhere, where would you go?"
    slot: travel
    store: "I would love to travel to {x}."
  ask_mood:
    text: ""
    slot: mood

# Asked in turn by "ask me something" (topic_suggest), skipping what ENGRAMM already knows.
ask_order: [ask_name, ask_hobby, ask_home, ask_job, ask_food, ask_music, ask_travel, ask_colour, ask_family]
