  advice:
    work_people:
      - "Wenn es dich weiter beschäftigt, hilft oft ein ruhiges Gespräch unter vier Augen: Beschreib die konkrete Situation und wie sie auf dich gewirkt hat – nicht die Person."
      - "Schreib dir auf, was genau dich gestört hat, solange es frisch ist. Das macht ein späteres Gespräch viel leichter."
      - "Schlaf eine Nacht drüber. Wenn es morgen noch wichtig ist, sprich es direkt an; wenn es sich wiederholt, helfen Vertrauenspersonen oder die Personalabteilung."
    people:
      - "Wenn ihr beide ruhig seid, sag, wie es sich für dich angefühlt hat – „Ich war verletzt, als …“ kommt besser an als „Du immer …“."
      - "Gib dem Ganzen etwas Zeit und sprecht dann in Ruhe darüber. Die meisten Konflikte werden kleiner, wenn sich beide gehört fühlen."
    heartbreak:
      - "Sei gut zu dir – Liebeskummer tut wirklich weh. Lass dich von Freunden und Familie auffangen, behalte etwas Alltag bei und gib dir Zeit. Es wird leichter."
      - "Triff gerade keine großen Entscheidungen. Rede mit Menschen, die dir guttun, geh jeden Tag ein bisschen raus und erlaub dir, traurig zu sein."
    grief:
      - "Trauer muss man nicht reparieren – sie ist Liebe, die nirgendwo hin kann. Lass sie zu und stütz dich auf die Menschen um dich herum."
      - "Nimm dir Tag für Tag. Wenn es zu schwer wird, kann ein Gespräch mit einer Beratungsstelle oder deinem Arzt wirklich helfen."
    career:
      - "Bevor du entscheidest: Schreib auf, was du vermissen würdest und was nicht – und was du dir vom nächsten Job wünschst. Wenn möglich, such erst in Ruhe etwas Neues."
      - "Frag dich, ob es am Job, an den Leuten oder an der Menge liegt. Manchmal hilft ein Gespräch oder ein Teamwechsel, manchmal ist es Zeit zu gehen."
    failure:
      - "Ein Ergebnis bestimmt nicht, wer du bist. Schau dir an, woran es lag, mach einen Plan für das nächste Mal – und rechne dir den Versuch an."
      - "Erst mal durchatmen. Dann: Was kannst du daraus lernen? Die meisten, die Erfolg haben, sind vorher gescheitert."
    stress:
      - "Probier das: Schreib alles auf, was dir im Kopf herumgeht, und kreis das eine Ding ein, das du heute wirklich tun kannst. Die Liste wirkt danach viel kleiner."
      - "Ein paar langsame Atemzüge helfen mehr, als man denkt – vier Sekunden ein, vier halten, vier aus. Dann eine kleine Aufgabe angehen."
    tired:
      - "Ehrlich? Ausruhen. Etwas Richtiges essen, Wasser trinken und heute früh ins Bett – morgen ist ein neuer Tag."
      - "Mach eine echte Pause: zwanzig Minuten ohne Bildschirm, vielleicht ein kurzer Spaziergang."
    sad:
      - "Sei heute nachsichtig mit dir. Eine kurze Nachricht an jemanden, dem du vertraust, kann mehr helfen, als du denkst."
    generic:
      - "Was würdest du einer guten Freundin in derselben Lage raten? Das ist oft auch der beste Rat für dich selbst."
      - "Zerleg es: Was ist der allernächste kleine Schritt? Fang dort an."
    none:
      - "Worum geht es denn? Erzähl mir, was los ist, dann denken wir zusammen nach."
