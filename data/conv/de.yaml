      bitter: ["Total. So eine Niederlage nagt ein, zwei Tage – aber genau deshalb fühlen sich Siege so gut an.", "Ja, das schmerzt. Immerhin bist du nicht allein – alle Fans grummeln gerade."]
      saison: ["Genau die richtige Einstellung! Jede Saison ist ein Neuanfang.", "So ist es – neue Saison, neue Chancen. Fans sind die größten Optimisten."]
      langweilig_ka: ["Kein Problem. Wie wär's: ein Witz, ein spannender Fakt, ein kleines Quiz – oder ich gebe dir Ideen für später?"]
      chef: ["Das ist anstrengend – wenn ständig Neues dazukommt, hat man das Gefühl, nie fertig zu werden. Ist es gerade mehr, als du schaffen kannst?",
             "Puh, das ist viel. Ständig Extra-Aufgaben zermürben schnell. Weiß dein Chef, wie voll dein Teller schon ist?"]
      chef_rat: ["Was oft hilft:\n\n• Schreib kurz alles auf, was gerade auf deinem Tisch liegt, mit grober Zeitschätzung.\n• Geh damit zu deinem Chef und frag: „Was davon ist am wichtigsten? Wenn ich die neue Aufgabe übernehme, was kann warten?“\n• So wird die Überlastung sichtbar, ohne nach Beschwerde zu klingen – und die Prioritäten entscheidet er, nicht dein Stress.\n\nSoll ich dir beim Formulieren helfen?"]
      reise: ["{X} – wie schön! Worauf freust du dich am meisten?", "Oh, {X}! Wie toll. Warst du schon mal dort?"]
      reise_tipps: ["Ein paar Dinge, die eine Reise nach {X} leichter machen:\n\n• Ausweis bzw. Reisepass rechtzeitig prüfen.\n• Offline-Karten und eine Übersetzungs-App vorher herunterladen.\n• Ein paar Wörter in der Landessprache lernen – „hallo“, „danke“, „bitte“ öffnen viele Türen.\n• Die großen Sehenswürdigkeiten früh morgens besuchen, dann ist es leerer.\n\nWas interessiert dich – Essen, Sehenswürdigkeiten oder Ausgehen?"]
      reise_essen:
        rom: ["Essen in Rom: Carbonara, Cacio e Pepe und Amatriciana in einer Trattoria, Pizza al taglio auf die Hand, Supplì (frittierte Reisbällchen) und natürlich Gelato. Kaffee an der Theke ist günstiger als am Tisch."]
        paris: ["Essen in Paris: morgens ein Croissant aus der Boulangerie, mittags ein Croque Monsieur oder Steak Frites im Bistro, Crêpes vom Stand und Macarons aus der Pâtisserie. Das Mittagsmenü ist viel günstiger als abends."]
        london: ["Essen in London: Fish and Chips, ein Full English Breakfast, Sunday Roast im Pub und Curry in der Brick Lane. Auf dem Borough Market kann man von allem probieren."]
        barcelona: ["Essen in Barcelona: Tapas wie Patatas Bravas und Croquetas, Pan con Tomate, Paella am Meer und Churros mit Schokolade. Abendessen um 21 Uhr ist normal."]
        lissabon: ["Essen in Lissabon: Pastéis de Nata, gegrillte Sardinen, Bacalhau und eine Bifana. Probier auch einen Ginjinha, den Kirschlikör."]
        wien: ["Essen in Wien: Wiener Schnitzel, Sachertorte im Kaffeehaus, Apfelstrudel und spätabends eine Wurst vom Würstelstand."]
        amsterdam: ["Essen in Amsterdam: frische Stroopwafels vom Markt, Bitterballen zum Bier, Matjes für Mutige und holländische Pfannkuchen."]
        tokio: ["Essen in Tokio: Sushi an der Theke, Ramen, Yakitori unter den Bahngleisen und Onigiri aus dem Konbini – überraschend gut. Trinkgeld ist nicht üblich."]
        berlin: ["Essen in Berlin: Currywurst, Döner, ein großes Frühstück am Wochenende und sehr gutes vietnamesisches Essen."]
        sonst: ["Mein bester Essens-Tipp für {X}: iss dort, wo die Einheimischen essen – kleine Lokale eine Straße abseits der Sehenswürdigkeiten, Märkte und Mittagsmenüs."]
      danke_fremd:
        grazie: ["Prego! 😊 Dein Italienisch kann sich sehen lassen."]
        merci: ["De rien ! 😊 Sehr schön französisch!"]
        gracias: ["¡De nada! 😊"]
        obrigado: ["De nada! 😊"]
        obrigada: ["De nada! 😊"]
        arigato: ["Dō itashimashite! 😊"]
      gefuehle: ["Ehrlich gesagt nein – ich bin Software, die liest, zählt und sich Dinge merkt. Aber ich leiste dir gern Gesellschaft.", "Nein, Gefühle habe ich nicht. Aber ich höre gern zu und merke mir, was dir wichtig ist."]
      name: ["Ich bin ENGRAMM!", "ENGRAMM – schön, dass du fragst!"]
      again_lead: ["Wie gesagt: ", "Wie vorhin schon: "]
      fakten:
        - {q: "(?:und )?wie viele planeten (?:hat|gibt es in) (?:unser(?:em)? |das )?sonnensystem|wie viele planeten gibt es", a: "Acht: Merkur, Venus, Erde, Mars, Jupiter, Saturn, Uranus und Neptun. Pluto gilt seit 2006 als Zwergplanet.", v: "8"}
        - {q: "(?:und )?(?:welcher planet ist|was ist) der rote planet|welcher planet wird (?:auch )?(?:der )?rote planet genannt|warum ist der mars rot", a: "Der Mars ist der Rote Planet – seine Oberfläche ist mit eisenhaltigem Staub bedeckt, der quasi verrostet ist. Daher die rötliche Farbe.", v: "Mars"}
        - {q: "(?:und )?(?:was|welches) ist das größte (?:säugetier|tier)(?: der welt| der erde)?", a: "Der Blauwal – er wird bis zu 30 Meter lang und rund 150 Tonnen schwer. Er ist das größte Tier, das je gelebt hat.", v: "Blauwal"}
        - {q: "(?:und )?wie viele kontinente gibt es(?: auf der erde)?", a: "Meist zählt man sieben: Afrika, Antarktika, Asien, Australien (Ozeanien), Europa, Nordamerika und Südamerika. In manchen Ländern werden Amerika oder Europa und Asien zusammengezählt.", v: "7"}
        - {q: "(?:und )?wer (?:war|ist) (?:der )?erste mensch auf dem mond|wer (?:war|ist) als erster auf dem mond|wer hat als erster den mond betreten", a: "Neil Armstrong – er betrat am 20. Juli 1969 mit Apollo 11 als Erster den Mond. Buzz Aldrin folgte ihm etwa 20 Minuten später.", v: "Neil Armstrong"}
        - {q: "(?:und )?wie viele beine hat (?:eine )?spinne|wie viele beine haben spinnen", a: "Spinnen haben acht Beine – deshalb zählen sie nicht zu den Insekten (die haben sechs).", v: "8"}
        - {q: "(?:und )?wer hat (?:das buch |den roman )?1984 geschrieben|wer ist der autor von 1984", a: "George Orwell hat „1984“ geschrieben, erschienen 1949.", v: "George Orwell"}
        - {q: "(?:und )?wie viele (?:länder|staaten|mitglieder|mitgliedsstaaten) (?:hat die eu|sind in der eu|gibt es in der eu)", a: "Die EU hat 27 Mitgliedsstaaten (seit dem Austritt Großbritanniens 2020).", v: "27"}
        - {q: "(?:und )?wer hat die glühbirne erfunden", a: "Viele haben daran getüftelt – aber Thomas Edisons Kohlefaden-Glühbirne von 1879 war die erste praktische, langlebige; Joseph Swan baute fast zeitgleich eine ähnliche in England.", v: "Thomas Edison"}
        - {q: "(?:und )?wie viele bundesländer hat deutschland|wie viele bundesländer gibt es", a: "Deutschland hat 16 Bundesländer.", v: "16"}
        - {q: "(?:und )?wer war der erste bundeskanzler(?: deutschlands| der bundesrepublik)?", a: "Konrad Adenauer – er war von 1949 bis 1963 der erste Bundeskanzler der Bundesrepublik Deutschland.", v: "Konrad Adenauer"}
        - {q: "(?:und )?wann (?:begann|startete|fing) der erste weltkrieg(?: an)?", a: "Der Erste Weltkrieg begann am 28. Juli 1914, einen Monat nach dem Attentat von Sarajevo.", v: "1914"}
        - {q: "(?:und )?wann (?:begann|startete|fing) der zweite weltkrieg(?: an)?", a: "Der Zweite Weltkrieg begann am 1. September 1939 mit dem deutschen Überfall auf Polen.", v: "1939"}
        - {q: "(?:und )?(?:wie heißt|was ist|welcher ist) der höchste berg afrikas|(?:was ist|welcher ist) der höchste berg in afrika", a: "Der Kilimandscharo in Tansania – mit 5.895 m der höchste Berg Afrikas.", v: "Kilimandscharo"}
        - {q: "(?:und )?wie viele herzen hat (?:ein|der) (?:oktopus|krake)", a: "Drei! Zwei pumpen Blut durch die Kiemen, eins durch den restlichen Körper.", v: "3"}
        - {q: "(?:und )?(?:welcher planet ist der sonne am nächsten|was ist der sonnennächste planet)", a: "Merkur ist der Planet, der der Sonne am nächsten ist.", v: "Merkur"}
        - {q: "(?:und )?(?:was|welches) ist das schnellste landtier|welches tier ist (?:an land )?am schnellsten", a: "Der Gepard – auf kurzen Strecken schafft er rund 100 km/h.", v: "Gepard"}
        - {q: "(?:und )?welches land hat die meisten (?:einwohner|menschen)|was ist das bevölkerungsreichste land(?: der welt)?", a: "Indien – rund 1,43 Milliarden Menschen. Laut UN-Schätzung hat es 2023 China (rund 1,41 Milliarden) überholt.", v: "Indien"}
        - {q: "(?:und )?wer hat (?:die )?neunte (?:sinfonie|symphonie) (?:komponiert|geschrieben)", a: "Ludwig van Beethoven – seine Neunte (1824) endet mit der „Ode an die Freude“, heute die Europahymne.", v: "Beethoven"}
        - {q: "(?:und )?wer war der erste mensch im (?:weltall|weltraum|all)", a: "Juri Gagarin – am 12. April 1961 umrundete er mit Wostok 1 einmal die Erde.", v: "Juri Gagarin"}
        - {q: "(?:und )?wie viele zähne hat (?:ein )?erwachsener(?: mensch)?", a: "Ein Erwachsener hat 32 Zähne, wenn alle Weisheitszähne da sind – sonst 28.", v: "32"}
        - {q: "(?:und )?was ist das größte organ des menschen|welches ist das größte organ", a: "Die Haut – bei Erwachsenen rund 2 m² groß und etwa 4 kg schwer. (Das größte innere Organ ist die Leber.)", v: "Haut"}
        - {q: "(?:und )?wie viele monde hat (?:der )?mars", a: "Der Mars hat zwei kleine Monde: Phobos und Deimos.", v: "2"}
        - {q: "(?:und )?(?:was|welches) ist die größte insel(?: der welt)?", a: "Grönland – rund 2,17 Millionen km². (Australien zählt als Kontinent.)", v: "Grönland"}
        - {q: "(?:und )?wie viele sekunden hat eine stunde", a: "Eine Stunde hat 3.600 Sekunden (60 × 60).", v: "3600"}
        - {q: "(?:und )?wer war der erste römische kaiser", a: "Augustus (Octavian) – erster römischer Kaiser von 27 v. Chr. bis 14 n. Chr.", v: "Augustus"}
        - {q: "(?:und )?wofür steht dna|was bedeutet dna", a: "DNA steht für Desoxyribonukleinsäure (englisch deoxyribonucleic acid).", v: "Desoxyribonukleinsäure"}
        - {q: "(?:und )?was ist h2o", a: "H₂O ist Wasser – zwei Wasserstoffatome und ein Sauerstoffatom.", v: "Wasser"}
        - {q: "(?:und )?wie weit ist der mond (?:von der erde )?(?:weg|entfernt)", a: "Der Mond ist im Schnitt etwa 384.400 km von der Erde entfernt – Licht braucht dafür rund 1,3 Sekunden.", v: "384.400 km", en: "how far is the moon"}
      superlativ:
        größte planet: "Der größte Planet ist Jupiter – etwa elfmal so breit wie die Erde."
        kleinste planet: "Der kleinste Planet ist Merkur – nur etwa 4.880 km breit."
        größte ozean: "Der größte Ozean ist der Pazifik – etwa 165 Millionen km², rund ein Drittel der Erdoberfläche."
        größte kontinent: "Der größte Kontinent ist Asien – rund 44 Millionen km²."
        kleinste kontinent: "Der kleinste Kontinent ist Australien."
        größte tier: "Das größte Tier ist der Blauwal – bis zu 30 Meter lang und schwerer als jeder Dinosaurier."
        größte wüste: "Die größte Wüste ist die Antarktis (Wüste heißt: kaum Niederschlag); die größte heiße Wüste ist die Sahara."
      macher: ["Das ENGRAMM-Projekt hat mich gemacht. Die Idee: ein hilfreicher Assistent, der offline läuft, seine Quellen zeigt und wirklich vergisst, wenn du es willst."]
    g73:
      eingeschlafen: ["Aww, wie gemütlich. 😊", "Haha, das Sofa gewinnt mal wieder. Gemütlich!"]
      kaffee: ["Ah, Kaffeepause! ☕ Wie trinkst du ihn – schwarz oder mit Milch?", "Kaffee geht immer! ☕"]
      tee: ["Teezeit! 🍵 Welcher denn?", "Schön, eine Tasse Tee. Grün, schwarz oder Kräuter?"]
      essen: ["Guten Appetit! 😋", "Lass es dir schmecken!"]
      fernsehen: ["Oh, was läuft denn?", "Schön! Was schaust du?"]
      angerufen: ["Wie schön! Wie geht's {x}?", "Schön, dass {y} sich gemeldet hat. Alles gut bei {x}?"]
      verspaetung: ["Ach nee, schon wieder? Das nervt, gerade wenn man es eilig hat.", "Nicht schon wieder! Hast du es noch rechtzeitig geschafft?"]
      allergie: ["Gut zu wissen – ich merke mir, dass du allergisch gegen {x} bist.", "Notiert: Allergie gegen {x}. Behalte ich im Kopf."]
      kinder: ["Oh, {x}! Wie heißen sie?", "{X} – schön! Wie alt sind sie?"]
      geburtstag: ["{x} – notiert! 🎂 Ich merke mir deinen Geburtstag.", "Dein Geburtstag ist am {x}? Merk ich mir! 🎂"]
      wohnen: ["Schön, ihr wohnt zusammen! Wie lange schon?", "Alles klar, du wohnst mit {x} zusammen. Merk ich mir."]
    g74:
      rasse: ["Kommt auf dein Leben an! Beliebt sind: Labrador oder Golden Retriever (freundlich, familientauglich), Beagle (fröhlich, braucht Bewegung), Cavalier King Charles Spaniel oder Französische Bulldogge (kleiner, ruhiger) – und Mischlinge aus dem Tierheim sind oft wunderbar. Wie viel Platz und Zeit hast du?"]
      klein_hund: ["Dann passt ein kleinerer, ruhiger Hund besser – etwa eine Französische Bulldogge, ein Cavalier King Charles Spaniel, ein Shih Tzu oder ein ruhiger erwachsener Hund aus dem Tierheim. Tägliche Spaziergänge zählen mehr als die Größe der Wohnung."]
      katze: ["Eine Katze passt super in eine kleine Wohnung: kein Gassigehen, tagsüber gut allein, und glücklich mit Fensterplatz und Kletterbaum. Zwei Katzen leisten sich gegenseitig Gesellschaft."]
      katze_ok: ["Klingt nach einer guten Wahl! Im Tierheim gibt es oft tolle erwachsene Katzen, deren Charakter man schon kennt."]
      hund: ["Ein Hund – wie schön! Was reizt dich daran?", "Oh, ein Hund! Hast du schon eine Rasse im Kopf?"]
    g75:
      krank: "Hier ist eine Nachricht, die du nutzen kannst:\n\nHallo [Name],\n\nleider bin ich krank und kann heute nicht zur Arbeit kommen. Dringende E-Mails schaue ich mir an, wenn es mir möglich ist. Ich melde mich, sobald ich wieder fit bin.\n\nViele Grüße\n[Dein Name]"
      ohne_kochen: ["Ganz ohne Kochen:\n\n• Ein Brot oder Wrap mit dem, was im Kühlschrank ist\n• Joghurt mit Obst und Müsli\n• Ein großer Salat mit Kichererbsen, Feta und Tomaten\n• Hummus mit Brot und Rohkost\n• Oder einfach bestellen – völlig okay.\n\nWas klingt gut?"]
    g76:
      regen: ["Na toll, ja – Regen kann richtig aufs Gemüt schlagen. Immerhin eine gute Ausrede für einen gemütlichen Tag drinnen?"]
      kaputt: ["Oh nein, das auch noch! Was ist denn kaputt?", "So ein Pech! Ist es etwas, das sich reparieren lässt?"]
      verpasst: ["Oh nein, verpasst? Das ist so ärgerlich. Wann kommt der nächste?"]
      nicht_ganz: ["Danke, dass du ehrlich bist. Was ist los?", "Das ist okay – du musst nicht gut drauf sein. Magst du erzählen?"]
      ironie_arbeit: ["Ha, die Begeisterung spür ich bis hierher. 😅 Ist es gerade viel?"]
    g78:
      haehnchen: ["Ein paar Ideen mit Hähnchen:\n\n• Hähnchen-Fajitas mit Paprika und Zwiebeln\n• Zitronen-Knoblauch-Hähnchen mit Ofenkartoffeln\n• Ein schnelles Hähnchen-Curry mit Reis\n\nWas davon klingt gut?"]
      paris: ["Ich war nie irgendwo – ich lese nur. Aber über {x} lese ich viel: Museen, Cafés, das Essen … klingt wunderbar. Warst du schon dort?"]
      dort: ["Oh schön! Was hat dir am besten gefallen?", "Wie toll! Was war das Highlight?"]
      essen_war: ["Oh, lecker! Was war das Beste, was du gegessen hast?", "Schön! Gibt's ein Gericht, an das du heute noch denkst?"]
      film_plan: ["Gute Idee! Weißt du schon, welchen?", "Schön, ein Filmabend! Schon eine Idee, was es wird?"]
      film_tipps: ["Ein paar Filme zum Lachen: „Grand Budapest Hotel“, „Paddington 2“, „Hot Fuzz“ oder „Ziemlich beste Freunde“. Soll ich noch mehr vorschlagen?"]
      film_tipps_allg: ["Ein paar Filmtipps: „Ziemlich beste Freunde“, „Inception“, „Das Leben der Anderen“ oder „Paddington 2“. Eher lustig, spannend oder zum Nachdenken?"]
      muede_du: ["Mir geht's gut, danke! Müde Tage sind zäh – war viel los?"]
      alter_bau: ["{x} ist rund {n} Jahre alt – fertiggestellt wurde er {y}."]
    g79:
      handy: ["Oh nein! Ist es heil geblieben?", "Autsch! Funktioniert es noch?"]
      lernen: ["Oh schön, {x}! Wie lange machst du das schon?", "Toll – {x} zu lernen macht richtig Spaß. Wie läuft's bisher?"]
      fuehrerschein: ["Glückwunsch zum Führerschein! 🎉 Wohin geht die erste Fahrt?"]
      sinn: ["Große Frage! Beantworten kann ich sie dir nicht – aber ich kann dir erzählen, was Philosophen wie Aristoteles oder Camus darüber dachten. Frag einfach."]
      nachbarn: ["Oh je, das ist anstrengend, gerade wenn man Ruhe braucht. Ist das jeden Tag so?", "Das nervt richtig. Konntest du schon mal mit ihnen reden?"]
      nettes: ["Du bist wichtig – und auch ein mittelmäßiger Tag zählt. Schön, dass du da bist. 😊", "Du gibst dir Mühe, und das merkt man. Gönn dir heute was Schönes!"]
      stau: ["Oh nein, Stau – hoffentlich löst er sich bald auf. Läuft wenigstens gute Musik?", "Nicht schön! Kommst du jetzt zu spät?"]
      geheimnis: ["Deine Geheimnisse bleiben auf deinem Rechner – ich schicke nichts irgendwohin. Und wenn ich etwas vergessen soll, sag einfach „vergiss, dass …“."]
      zurueck: ["Schön, dass du wieder da bist! Wo waren wir stehen geblieben?", "Willkommen zurück! Was gibt's?"]
      morgen: ["Guten Morgen! ☀️ Gut geschlafen?", "Guten Morgen! Was steht heute an?"]
    g81:
      spezial:
        wlan: "Ohne Internet geht gar nichts, oder? Router kurz vom Strom nehmen, 30 Sekunden warten, wieder einstecken – das hilft erstaunlich oft."
        internet: "Ohne Internet geht gar nichts, oder? Router kurz vom Strom nehmen, 30 Sekunden warten, wieder einstecken – das hilft erstaunlich oft."
        langsam: "Ein langsamer Rechner nervt so. Browser-Tabs schließen und einmal neu starten hilft oft mehr, als man denkt."
        pflanze: "Oh nein, deine Pflanze! Oft ist es eher zu viel Wasser als zu wenig. Vielleicht bekommt die nächste einen helleren Platz?"
        kaffee: "Kalter Kaffee ist eine kleine Tragödie. ☕ Mikrowelle oder frische Tasse?"
        tee: "Kalter Tee – der Klassiker. Neue Tasse?"
        salzig: "Zu salzig? Ein Schuss Wasser oder ungesalzene Brühe, eine rohe Kartoffel mitköcheln oder etwas Zitrone können sie retten."
        nass: "Nasse Schuhe sind das Schlimmste! Mit Zeitungspapier ausstopfen – dann trocknen sie viel schneller."
        unordentlich: "Kennt jeder! Zehn Minuten Aufräumen mit guter Musik wirken Wunder."
        geklaut: "Oh nein, wie ärgerlich! Hast du es schon bei der Polizei gemeldet? Das lohnt sich auch für die Versicherung."
        zahn: "Autsch, Zahnschmerzen sind fies. Mit warmem Salzwasser spülen kann etwas helfen – und wenn es länger als ein, zwei Tage anhält, lieber zum Zahnarzt."
        rücken: "Rückenschmerzen sind echt unangenehm. Sanfte Bewegung und Wärme helfen meist mehr als Liegen. Wenn es nicht besser wird, lieber zum Arzt."
        bauch: "Oh je. Tee und leichtes Essen helfen oft. Wenn es stark ist oder nicht weggeht, bitte zum Arzt."
        brust: "Brustschmerzen können ernst sein. Wenn sie stark sind, in Arm, Kiefer oder Rücken ausstrahlen oder du schlecht Luft bekommst: Ruf sofort den Notruf 112."
      neg: ["Oh je, das nervt. Lässt sich das schnell beheben?", "Ach nee, das hat gerade noch gefehlt. Was ist passiert?"]
      farbe: ["{X} – schöne Farbe!", "Oh, {X}! Gefällt mir."]
