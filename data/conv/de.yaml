      weather_plans: ["Wenn das Wetter einem die Pläne verhagelt … Vielleicht heute ein Workout drinnen – oder eine Runde im Regen, wenn du mutig bist?", "Oh nein, da fällt der Plan ins Wasser. Workout zu Hause, oder auf eine trockene Phase warten?"]
      maybe_tomorrow: ["Klingt nach einem Plan – Daumen drücken für besseres Wetter.", "Gute Idee. Morgen macht's dann doppelt Spaß."]
