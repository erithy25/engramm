      sleep_work: ["Der Druck macht's noch schwerer, ich weiß. Zähl lieber nicht die Stunden – auch Ruhen mit geschlossenen Augen hilft.", "Genau dieses 'Ich MUSS jetzt schlafen' hält einen wach. Ausruhen zählt auch, selbst wenn der Schlaf nicht sofort kommt."]
      device: ["Oh nein, ein leeres {x} im ungünstigsten Moment – typisch. Hast du ein Ladekabel in der Nähe?", "Akku leer? Hoffentlich ist ein Ladekabel griffbereit."]
      charger: ["Ladekabel verschwinden immer genau dann, wenn man sie braucht. Schau in der Tasche, am Bett und zwischen den Sofakissen – oder leih dir eins?", "Natürlich ist es jetzt weg. Die üblichen Verstecke: Tasche, Nachttisch, Sofa. Kannst du dir eins leihen?"]
      weather:
