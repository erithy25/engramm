    sleep: {intro: "Was beim Schlafen hilft:", outro: "Ist eher das Einschlafen oder das Durchschlafen schwer?"}
    study: {intro: "Ein paar Lerntipps, die wirklich helfen:", outro: "Wofür lernst du gerade?"}
    focus: {intro: "Ein paar Wege, Dinge geschafft zu bekommen:", outro: "Was willst du heute erledigen?"}
    exercise: {intro: "Ein paar einfache Wege, mehr in Bewegung zu kommen:", outro: "Eher zu Hause oder draußen?"}
    petname: {intro: "Ein paar Namen, die viele mögen:", outro: "Ist es ein Hund, eine Katze oder etwas anderes?"}
  # Alltagsschicht (dialog._german_life)
  life:
    thanks: ["Sehr gern!", "Gern geschehen – dafür bin ich da.", "Immer gern!"]
    thanks_idea: ["Gern! Sag mir später, ob es geholfen hat.", "Freut mich! Ich hoffe, es klappt."]
    thanks_listen: ["Jederzeit. Ich bin da, wenn du reden magst.", "Gern – dafür bin ich da. Pass auf dich auf."]
    thanks_praise: ["Hast du dir verdient!", "Wirklich verdient – gut gemacht!"]
    greeting: ["Hey! Alles gut bei dir?", "Na? Schön, dass du da bist. Wie läuft's?"]
