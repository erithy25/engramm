      moving_where: ["{x} – das ist ganz schön weit. Wann ist der Umzug?", "{x}, wow. Ein großer Schritt. Wann geht's los?"]
      moving_when: ["Dann habt ihr noch ein bisschen Zeit. Vielleicht plant ihr noch etwas Besonderes vor dem Umzug?", "Das ist bald. Nutzt die Wochen – ein letzter Ausflug oder euer Lieblingsessen zusammen?"]
      moving_miss: ["Natürlich – das zeigt, wie nah ihr euch steht. Entfernung verändert vieles, aber Anrufe, Nachrichten und Besuche halten echte Freundschaften zusammen.", "Das glaube ich dir. Es tut weh, weil es dir wichtig ist. Ein Videoanruf ist nicht dasselbe, aber echte Freundschaften überstehen die Entfernung."]
