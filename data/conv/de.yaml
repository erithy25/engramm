    game: {intro: "Ein paar Spiele zum Ausprobieren:", outro: "Brettspiele oder Videospiele?"}
    activity: {intro: "Ein paar Ideen, was du machen könntest:", outro: "Klingt etwas davon gut?"}
    gift: {intro: "Ein paar Geschenkideen:", outro: "Für wen ist es? Erzähl mir ein bisschen, dann wird's genauer."}
    travel: {intro: "Ein paar Orte, die viele lieben:", outro: "Stadt, Strand oder Natur?"}
