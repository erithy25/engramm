    bot_human: ["Nein, ich bin kein Mensch – ich bin ENGRAMM, ein Programm auf deinem Rechner. Kein neuronales Netz, keine Cloud: Ich antworte aus dem, was ich gelesen habe, und aus dem, was du mir erzählst.", "Nein, ich bin ein Programm namens ENGRAMM. Aber ich höre dir trotzdem gern zu!"]
    wfh_lonely: ["Das kann ich gut verstehen – Homeoffice kann richtig einsam machen. Ganze Tage ohne ein echtes Gespräch.", "Ja, zu Hause arbeiten ist praktisch, aber man sieht kaum Leute. Kein Plausch an der Kaffeemaschine."]
    maybe_should: ["Das ist eine gute Idee – auch kleine Schritte zählen. Soll ich dir ein paar Ideen geben?", "Finde ich gut! Klein anfangen ist völlig okay. Magst du ein paar Vorschläge?"]
    lonely_ideas: ["Ein paar Ideen:\n\n• Ein, zwei Tage pro Woche im Café oder Co-Working arbeiten\n• Etwas Regelmäßiges: Sportverein, Kurs, Chor, Lauftreff\n• Ehrenamt – man lernt Leute kennen und tut Gutes\n• Heute einer alten Freundin oder einem alten Freund schreiben\n\nKlingt etwas davon nach dir?"]
    ideas_liked: ["Schön, dass dir was davon gefällt! Schon einer davon ist ein toller Anfang.", "Super! Fang mit dem an, was am leichtesten klingt – und erzähl mir, wie's war."]
    work_stress: ["Das klingt nach richtig viel. Was belastet dich gerade am meisten – die Menge oder der Druck?", "Puh, das ist anstrengend. Ist das gerade eine besonders stressige Phase, oder schon länger so?"]
    boss_pressure: ["Druck vom Chef macht es doppelt schwer. Hast du schon mal angesprochen, dass es gerade zu viel ist?", "Das ist echt unangenehm. Weiß dein Chef, wie viel du gerade auf dem Tisch hast?"]
    work_tips: ["Ein paar Dinge, die oft helfen:\n\n• Aufschreiben, was ansteht, und die drei wichtigsten Punkte markieren\n• Mit dem Chef offen über Prioritäten sprechen: „Was soll zuerst fertig werden?“\n• Kleine Pausen einplanen – auch fünf Minuten an der frischen Luft\n• Nach Feierabend bewusst abschalten, Handy weg\n\nWenn es dauerhaft zu viel ist, ist das kein persönliches Versagen."]
