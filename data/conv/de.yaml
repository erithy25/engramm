    sleep: {intro: "Was beim Schlafen hilft:", outro: "Ist eher das Einschlafen oder das Durchschlafen schwer?"}
    study: {intro: "Ein paar Lerntipps, die wirklich helfen:", outro: "Wofür lernst du gerade?"}
    focus: {intro: "Ein paar Wege, Dinge geschafft zu bekommen:", outro: "Was willst du heute erledigen?"}
    exercise: {intro: "Ein paar einfache Wege, mehr in Bewegung zu kommen:", outro: "Eher zu Hause oder draußen?"}
