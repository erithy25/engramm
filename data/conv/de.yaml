        sonst: ["Etwas Leichtes und Frisches – ein trockener Weißwein, ein kaltes Bier oder Sprudelwasser mit Zitrone."]
      spiel: ["Schauen kann ich leider nichts – aber erzähl! Welches Spiel denn?", "Ich kann nichts sehen, nur lesen. Welches Spiel meinst du?"]
      sport: ["Ah, {x}! Wer hat gespielt – und war's ein gutes Spiel?", "Oh, {x}! Wen hast du geschaut?"]
      verloren: ["Autsch, {a}:{b} tut weh. Tut mir leid! War's wenigstens ein gutes Spiel?", "Oh nein, {a}:{b} – das ist bitter."]
