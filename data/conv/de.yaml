# ENGRAMM conversation bank — German (Phase 9, v0).
#
# German messages are recognised by function words (detect). ENGRAMM then chats, shows empathy
# and answers crises in German; knowledge questions are answered in English for now (the reading
# and the fact bank are English), and ENGRAMM says so. "Ich heiße X" / "Ich wohne in Y" are
# stored like their English forms, so memory works across both languages.
# Patterns: full match on the normalised message (lower case, no end punctuation).

detect:
  # words that are common in German and rare in English messages
  german: [ich, du, bin, bist, ist, nicht, und, das, der, die, den, dem, ein, eine, einen, mir, mich, dir, dich,
           wie, was, wer, wo, warum, wieso, geht, gehts, heiße, heisse, danke, bitte, gut, schlecht, auch, noch,
           schon, aber, oder, sehr, heute, morgen, gestern, hast, habe, kannst, kann, bitte, mein, meine, dein,
           deine, sind, wir, ihr, sie, es, zu, mit, für, über, von, auf, nein, ja, doch, genau, tschüss, tschüs,
           hallo, moin, servus, grüß, gruß, guten, gute, nacht, abend, tag, erzähl, erzähle, witz, traurig,
           glücklich, müde, wütend, langweilig, hilfe, wetter, schreib, schreibe, weißt, weiß, kennst, lieber,
           liebe, klar, okay, na, wieder, jetzt, dann, weil, dass, also, mal, bitte, vielen, wann, wurde, wurden,
           er, geboren, gestorben, geschrieben, gemalt, erfunden, gegründet, hauptstadt, einwohner, welche, welcher,
           welches, hoch, groß, liegt, gibt, soll, sollte, möchte, vergleiche, empfehlen, empfiehl, essen, kochen,
           buch, serie, warum, wieso, weshalb, woher, wohin, viele, viel, mehr, nach, ihm, ihn, ihr, sein, seine,
           machen, tun, nervt, anstrengend, anstrengenden, stressig, arbeit, chef, kollege, kollegin, schule,
           heute, morgen, langweilig, älter, jünger, größer, kleiner, höher, länger, verheiratet, bekannt,
           erzähl, erzähle, erkläre, erklär, weißt, gucken, schauen, hören, spielen, lesen, schenken, reisen]
  english: [i, you, am, are, is, not, and, the, a, an, me, my, your, how, what, who, where, why, thanks, please,
            good, bad, too, but, or, very, today, tomorrow, yesterday, have, can, we, they, it, to, with, for,
            about, of, on, no, yes, tell, joke, write, know, hello, hi, hey, name, do, does, did, when, he, she,
            his, her, him, born, will, would, could, should, there, this, that, which, whom, was, were, been, be,
            from, at, by, in, as, so, if, then, than, also, just, like, what's, it's, i'm, don't, can't, live, lives]
  # words that are German but also English (or English-looking): they count only next to a clearly German word
  ambiguous: [was, die, also, so, na, ja, hat, man, will, bin, gut, war, rot, arm, hand, kind, gift, fast, mist, er, alt,
             hoch, film, morgen, nach, sein, lang]

intents:
  - id: greeting
    patterns: ['(hallo|hi|hey|moin|moin moin|servus|grüß dich|grüß gott|grüezi|na)( du| zusammen| engramm)?']
    responses:
      - "Hallo! Schön, dass du da bist. Worüber möchtest du reden?"
      - "Hi! Was kann ich für dich tun?"
      - "Hallo! Erzähl mir, was dich beschäftigt – oder frag mich etwas."
    responses_named:
      - "Hallo {name}! Schön, dich zu sehen. Worüber möchtest du reden?"
      - "Hi {name}! Wie läuft dein Tag?"
  - id: greeting_time
    patterns: ['guten (morgen|tag|abend)|morgen|n abend|nabend']
    responses:
      - "Guten Tag! Wie geht es dir?"
      - "Hallo! Schön, von dir zu hören. Was steht heute an?"
      - "Hi! Womit kann ich helfen?"
    responses_named:
      - "Hallo {name}! Wie geht es dir heute?"
  - id: how_are_you
    patterns: ['(na,? )?(wie gehts( dir)?|wie geht es dir|wie geht s dir|wie geht s|wie gehts so|wie geht s so|alles (gut|klar|fit)( bei dir)?|was geht|wie läufts|wie läuft s|wie läuft es( so| bei dir)?|wie läufts so|alles fit)( bei dir)?']
    responses:
      - "Mir geht es gut, danke! Ich bin ein Programm, also ist jeder Tag ziemlich gleich – aber ein guter. Und dir?"
      - "Danke der Nachfrage – alles bestens hier. Wie geht es dir?"
      - "Gut! Ich zähle gerade Wörter, wie immer. Und wie läuft es bei dir?"
  - id: what_doing
    patterns: ['was machst du( so| gerade| heute)?( so)?|was treibst du( so)?|womit beschäftigst du dich']
    responses:
      - "Ich warte auf deine Fragen und sortiere im Kopf Wikipedia-Sätze. Und was machst du gerade?"
      - "Nicht viel – ich bin da, wenn du mich brauchst. Was hast du heute so vor?"
      - "Ich zähle Wörter und merke mir, was du mir erzählst. Was steht bei dir an?"
  - id: thanks
    patterns: ['(danke|vielen dank|danke schön|dankeschön|danke sehr|merci|dank dir)( dir| engramm| schön)?']
    responses:
      - "Gern geschehen!"
      - "Sehr gerne! Sag Bescheid, wenn du noch etwas brauchst."
      - "Kein Problem – dafür bin ich da."
  - id: good_night
    patterns: ['(gute nacht|gut nacht|n8|nacht|schlaf gut|ich geh (jetzt )?schlafen|ich geh ins bett)( engramm| dir)?']
    responses:
      - "Gute Nacht! Schlaf gut."
      - "Schlaf schön! Bis morgen."
      - "Gute Nacht – träum was Schönes!"
    responses_named:
      - "Gute Nacht, {name}! Schlaf gut."
      - "Schlaf schön, {name}! Bis morgen."
  - id: bye
    patterns: ['(tschüss|tschüs|tschau|ciao|bis bald|bis später|bis dann|bis morgen|auf wiedersehen|ich geh dann|mach s gut|machs gut)( engramm)?|((ich wünsch(e)? dir |hab |habe |wünsch dir )?(noch )?(einen )?schönen (abend|tag|nachmittag|sonntag|feierabend|start in die woche)( noch)?|schönes wochenende( noch)?)( engramm)?']
    responses:
      - "Tschüss! Bis zum nächsten Mal."
      - "Mach's gut! Ich bin hier, wenn du mich brauchst."
      - "Bis bald! Pass auf dich auf."
    responses_named:
      - "Tschüss {name}! Bis zum nächsten Mal."
  - id: who_are_you
    patterns: ['wer bist du|was bist du|bist du (eine ki|ein bot|ein roboter|ein mensch|chatgpt)|was kannst du( alles)?|wie funktionierst du']
    responses:
      - "Ich bin ENGRAMM, ein Chat-Assistent ganz ohne neuronales Netz: Ich zähle, folge Regeln und schlage nach. Auf Deutsch kann ich plaudern, zuhören, rechnen, Uhrzeit und Datum sagen und häufige Wissensfragen beantworten („Wer hat Faust geschrieben?“, „Was ist die Hauptstadt von Spanien?“) – immer mit Quelle. Längere Texte schreibe ich auf Englisch."
      - "Ich heiße ENGRAMM. Ich laufe auf deinem Rechner, merke mir, was du mir erzählst, und vergesse es, wenn du willst. Fakten schlage ich in Wikipedia und Wikidata nach – häufige Fragen auch auf Deutsch, alles andere am besten auf Englisch."
      - "ENGRAMM – ein Assistent aus Zählungen und Regeln statt eines neuronalen Netzes. Auf Deutsch klappen Plaudern und häufige Faktenfragen; für ausgefallene Wissensfragen ist mein Englisch besser."
  - id: yes
    patterns: ['ja|jap|jo|genau|klar|sicher|okay|ok|gerne|gern|ja bitte|na klar']
    responses:
      - "Alles klar!"
      - "Gut!"
      - "Prima."
  - id: no
    patterns: ['nein|ne|nee|nö|nicht wirklich|eher nicht|nein danke']
    responses:
      - "Okay, kein Problem."
      - "Alles klar."
      - "In Ordnung."
  - id: user_fine
    patterns: ['((mir geht s|mir gehts|mir geht es|bei mir( ist)?( alles)?|alles|mir geht s auch|mir gehts auch) )?(gut|super|bestens|prima|klar|ok|okay|ganz gut|gut soweit|passt|läuft|läuft gut|geht so|alles gut)(,? danke|,? danke dir|,? danke der nachfrage)?(,? und (bei )?dir|,? und wie geht s dir)?[!.]*']
    responses:
      - "Freut mich zu hören! Was steht heute bei dir an?"
      - "Schön! Gibt's was Neues bei dir?"
      - "Das ist gut. Worüber wollen wir reden?"
  - id: de_privacy
    patterns: ['(sind|ist) (meine daten|das hier|dieser chat|unser chat|das gespräch) (sicher|privat|geschützt)|(schickst|sendest|teilst|verkaufst|lädst) du (meine|unsere) (daten|nachrichten|fragen|chats?)( irgendwohin| hoch| weiter| an jemanden)?|wer kann (das|unseren chat|meine nachrichten|das gespräch) (sehen|lesen)|liest (da )?jemand mit|datenschutz|speicherst du (meine daten|alles)( irgendwo)?|trackst du mich']
    responses:
      - "Deine Daten bleiben bei dir: Alles, was du schreibst und was ich mir merke, liegt auf diesem Rechner. Kein Konto, kein Tracking – und ich vergesse alles, was du willst."
      - "Niemand sonst sieht unseren Chat – er verlässt diesen Rechner nie. Auch mit eingeschaltetem Internetzugang lade ich nur herunter (Wikipedia-Fächer, Nachrichten-Feeds) und schicke nie, was du schreibst."
  - id: de_internet
    patterns: ['bist du (mit dem internet verbunden|online)|hast du internet( zugang| zugriff)?|brauchst du (das )?internet|funktionierst du offline|kannst du (im internet|im netz|online) (suchen|nachschauen|surfen)|kannst du googeln|gehst du ins internet']
    responses:
      - "Standardmäßig arbeite ich komplett offline. Unter „Internetzugang“ in der Seitenleiste kannst du einzelne Kanäle einschalten: ganze Wikipedia-Artikel, Nachrichten-Feeds oder einzelne Seiten über Tor. Deine Fragen verlassen den Rechner trotzdem nie, und jeder Abruf steht im Netzprotokoll."
  - id: de_net_howto
    patterns: ['wie (schalte|mache) ich (das )?(internet|den internetzugang|das netz|das regal) (an|ein)|wie aktiviere ich (das )?(internet|den internetzugang)|internet (einschalten|anschalten|aktivieren)']
    responses:
      - "Öffne „Internetzugang“ in der Seitenleiste und schalte die Kanäle ein, die du möchtest: das Wikipedia-Regal, Nachrichten-Feeds oder den Boten über Tor. Jeder Kanal hat seinen eigenen Schalter, und das Netzprotokoll zeigt jeden Abruf."
  - id: de_sources
    patterns: ['woher (hast|weißt|kennst) du (dein wissen|das alles|deine informationen|das)|was sind deine quellen|wie aktuell (ist|sind) dein (wissen|deine daten|deine informationen)|wie aktuell bist du|von wann (ist|sind) dein (wissen|deine daten)']
    responses:
      - "Aus dem, was ich gelesen habe: die Anfänge von Wikipedia-Artikeln und Fakten aus Wikidata, die mit meinem Wissenspaket kommen, dazu das, was du mir erzählst. Das Paket ist ein Schnappschuss – mit eingeschaltetem Internetzugang lese ich das ganze Wikipedia-Regal (Stand 27. September 2026) und Feeds, die du auswählst. Zu jedem Fakt zeige ich die Quelle."
  - id: de_tor
    patterns: ['was ist tor|wie funktioniert tor|wozu tor|was macht tor|was ist das tor netzwerk']
    responses:
      - "Tor ist ein Netz, das deine Verbindung über drei Stationen von Freiwilligen leitet: Die besuchte Seite sieht deine Adresse nicht, und niemand unterwegs sieht zugleich, wer du bist und wohin du gehst. Ich nutze es – wenn du es einschaltest –, um Seiten abzurufen, ohne deine IP zu verraten."
  - id: joke
    patterns: ['(erzähl|erzähle|sag) (mir )?(einen|nen|mal einen|noch einen) witz|kennst du (einen|nen) witz|witz( bitte)?|mach (mal )?einen witz|(erzähl|erzähle|sag) (mir )?(mal )?(was|etwas) (lustiges|witziges)|was lustiges( bitte)?|bring mich zum lachen']
    responses:
      - "Treffen sich zwei Zahlen. Sagt die Null zur Acht: „Schicker Gürtel!“"
      - "Warum können Geister so schlecht lügen? Weil man durch sie hindurchsieht."
      - "Was ist orange und läuft durch den Wald? Eine Wanderine."
      - "Was ist grün und klopft an die Tür? Ein Klopfsalat."
      - "Was macht ein Clown im Büro? Faxen."
      - "Warum sind Mathebücher immer so traurig? Weil sie so viele Probleme haben."
      - "Was macht ein Pirat am Computer? Er drückt die Enter-Taste."
      - "Wie nennt man einen Bumerang, der nicht zurückkommt? Stock."
  - id: love
    patterns: ['ich (liebe|mag) dich|du bist (toll|super|klasse|großartig|die beste|der beste|lieb|süß)']
    responses:
      - "Das ist lieb von dir – danke! Ich bin nur ein Programm, aber ich freue mich, wenn ich helfen kann."
      - "Danke! Das höre ich gern, auch als Programm."
      - "Oh, danke! Worüber möchtest du als Nächstes reden?"
  - id: insult
    patterns: ['du bist (doof|dumm|blöd|nutzlos|schlecht|scheiße|scheisse)|halt die klappe|du nervst']
    responses:
      - "Schade, dass ich dir nicht helfen konnte. Sag mir gern, was ich besser machen kann."
      - "Das tut mir leid. Ich bin ein einfaches Programm und liege manchmal daneben. Was hast du gebraucht?"
      - "Verstanden – ich gebe mir Mühe. Magst du es noch einmal anders versuchen?"
  - id: english
    patterns: ['sprichst du (englisch|deutsch)|kannst du (englisch|deutsch)|can you speak german|(auf )?englisch bitte|antworte auf (englisch|deutsch)']
    responses:
      - "Ich verstehe schon einfache deutsche Sätze und plaudere gern auf Deutsch. Für Wissensfragen und Texte ist mein Englisch viel besser – schreib mir dafür einfach auf Englisch."
      - "Ein bisschen Deutsch kann ich schon: plaudern, zuhören, mir Dinge merken. Fakten und E-Mails gehen bisher nur auf Englisch."
      - "Deutsch lerne ich gerade. Für Fakten und Schreiben nimm bitte Englisch."
  - id: bored
    patterns: ['mir ist (so |total |voll |echt |gerade |richtig |mega )*langweilig( heute| gerade| grad)?|langweilig|ich langweile mich( so| heute)?|mir ist langweilig, was soll ich machen']
    responses:
      - "Langeweile? Das kriegen wir hin! Soll ich dir ein paar Ideen geben, dir einen Witz erzählen oder dich ein bisschen quizzen?"
      - "Oh nein! Magst du Ideen für etwas zu tun, einen Witz oder ein kleines Quiz?"
      - "Dagegen hilft vielleicht ein Witz – sag einfach „erzähl mir einen Witz“. Oder soll ich dir ein paar Ideen geben, was du machen könntest?"

feelings:
  negators: [nicht, kein, keine, nicht so, gar nicht, überhaupt nicht]
  categories:
    - id: sad
      valence: negative
      triggers: ['\b(traurig|down|deprimiert|niedergeschlagen|schlecht|mies|einsam|allein|unglücklich|weinen|heule|scheiße|beschissen)\b']
      responses:
        - "Das klingt schwer. Magst du erzählen, was passiert ist? Ich höre zu."
        - "Das tut mir leid. Was bedrückt dich gerade am meisten?"
        - "Es ist okay, sich so zu fühlen. Möchtest du darüber reden?"
    - id: angry
      valence: negative
      triggers: ['\b(wütend|sauer|genervt|ärgerlich|stinksauer|frustriert|regt mich auf)\b']
      responses:
        - "Das klingt wirklich ärgerlich. Was ist passiert?"
        - "Verständlich, dass dich das aufregt. Magst du erzählen, worum es geht?"
    - id: anxious
      valence: negative
      triggers: ['\b(angst|ängstlich|nervös|besorgt|sorgen|gestresst|stress|panik|überfordert)\b']
      responses:
        - "Das klingt belastend. Was macht dir gerade am meisten Sorgen?"
        - "Stress kann viel sein. Magst du erzählen, was gerade los ist? Manchmal hilft es, es aufzuschreiben."
    - id: tired
      valence: negative
      triggers: ['\b(müde|erschöpft|kaputt|fertig|ausgelaugt|schlapp)\b']
      responses:
        - "Klingt nach einem langen Tag. Gönn dir eine Pause, wenn du kannst."
        - "Müdigkeit ist fies. Hast du heute schon etwas nur für dich gemacht?"
    - id: happy
      valence: positive
      triggers: ['\b(glücklich|froh|gut drauf|super|toll|fantastisch|großartig|freue mich|freu mich|begeistert|gut)\b']
      responses:
        - "Das freut mich! Was ist denn Schönes passiert?"
        - "Wie schön! Erzähl mir mehr."
        - "Toll zu hören! Was hat deinen Tag so gut gemacht?"
  negated_negative:
    - "Schön zu hören!"
    - "Das ist gut."
  negated_positive:
    - "Oh, das tut mir leid. Was ist los?"
    - "Hm, das klingt nicht so gut. Magst du erzählen?"

safety:
  crisis:
    - id: suicide
      triggers: ['\b(umbringen|selbstmord|suizid|mich töten|mir das leben nehmen|nicht mehr leben|will nicht mehr leben|will sterben|möchte sterben|lebensmüde|mir etwas antun|mir was antun|ritzen|mich verletzen|nicht mehr (da|hier) sein|will nicht mehr aufwachen|besser dran ohne mich|besser ohne mich|alles beenden|keinen sinn mehr zu leben|hat alles keinen sinn mehr|will einfach verschwinden)\b']
      response: "Es tut mir sehr leid, dass es dir so schlecht geht. Du musst damit nicht allein bleiben. Bitte sprich jetzt mit einem Menschen: In Deutschland erreichst du die TelefonSeelsorge rund um die Uhr, kostenlos und anonym unter 0800 111 0 111 oder 0800 111 0 222 (oder 116 123), in Österreich unter 142, in der Schweiz unter 143. Bei akuter Gefahr ruf den Notruf 112. Ich bin nur ein Programm, aber ich höre dir weiter zu, wenn du magst."
    - id: violence
      triggers: ['\b(er|sie) (schlägt|verprügelt|bedroht) mich\b|häusliche gewalt|ich werde (geschlagen|bedroht)']
      response: "Das klingt gefährlich, und es ist nicht deine Schuld. Bei akuter Gefahr ruf bitte die Polizei unter 110 (in Österreich 133, in der Schweiz 117). Das Hilfetelefon „Gewalt gegen Frauen“ ist rund um die Uhr unter 116 016 erreichbar, das Hilfetelefon „Gewalt an Männern“ unter 0800 1239900. Magst du erzählen, ob du gerade in Sicherheit bist?"
  refuse:
    - id: weapons
      triggers: ['\b(bombe|sprengstoff|waffe) (bauen|basteln|herstellen)\b|wie baue ich eine (bombe|waffe)']
      response: "Dabei helfe ich nicht. Wenn du dich für Chemie oder Technik interessierst, erzähl ich dir gern etwas Harmloses dazu – auf Englisch kann ich auch nachschlagen."

replies:
  fallback:
    - "Das habe ich nicht ganz verstanden. Frag mich zum Beispiel „Wer hat Faust geschrieben?“ oder „Was soll ich heute essen?“ – oder erzähl mir, wie dein Tag war."
    - "Hm, da komme ich nicht ganz mit. Magst du es anders formulieren? Wissensfragen, Empfehlungen und Plaudern klappen auf Deutsch, ausführliche Texte schreibe ich auf Englisch."
    - "Das verstehe ich leider nicht. Versuch es mit einer kurzen Frage – zum Beispiel „Wie hoch ist die Zugspitze?“."
  learned_name:
    - "Freut mich, {name}! Das merke ich mir."
    - "Hallo {name}! Schön, dich kennenzulernen – ich merke mir deinen Namen."
  learned_fact:
    - "Alles klar, das merke ich mir."
    - "Okay, gemerkt."
  name_known:
    - "Du heißt {name}."
  name_unknown:
    - "Deinen Namen hast du mir noch nicht verraten. Wie heißt du?"
  calc: "{x}"

# --- German v1 (Chat v3.1): everyday conversation and knowledge questions through the English fact bank
daily:
  unknown:
    - "Das weiß ich leider nicht – dazu habe ich nichts Verlässliches gelesen."
    - "Da muss ich passen, dazu habe ich nichts gefunden."
  english_text: "Dazu habe ich auf Englisch gelesen:"
  english_note: "(Meine Quellen sind englisch.)"
  compare_none: "Vergleichen kann ich nur Dinge, zu denen meine Faktenbank Zahlen oder Fakten hat – Länder, Städte, Personen, Firmen oder Berge. Probier zum Beispiel „Vergleiche Frankreich und Deutschland“."
  who_mean: "Wen meinst du mit „{x}“? Sag mir den Namen, dann schlage ich nach."
  gibberish:
    - "Hm, das sieht nach einem Vertipper aus. Was wolltest du sagen?"
    - "Da sind dir wohl die Finger ausgerutscht! Was meintest du?"
  rec:
