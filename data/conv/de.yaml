      trinken:
        carbonara: ["Zu Carbonara passt ein frischer Weißwein, etwa Frascati oder Pinot Grigio. Ohne Alkohol: Sprudelwasser mit Zitrone – das macht das Gericht schön leichter."]
        bolognese: ["Ein mittelkräftiger Rotwein wie Chianti – oder ehrlich gesagt eine kalte Cola, kein Urteil."]
