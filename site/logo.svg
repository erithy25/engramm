<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="ENGRAMM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1446"/>
      <stop offset="0.5" stop-color="#4b2bd6"/>
      <stop offset="1" stop-color="#0fb5c9"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ff6ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7ff6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bits" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect x="8" y="8" width="16" height="16" rx="4" fill="#ffffff" opacity="0.10"/>
      <rect x="40" y="40" width="16" height="16" rx="4" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <clipPath id="sq"><rect width="1024" height="1024" rx="232"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#bits)"/>
    <rect width="1024" height="1024" fill="url(#shine)"/>
  </g>
  <!-- the E as a memory trace: a spine, three bars, a memory cell at each end -->
  <g transform="translate(-39 0)">
  <g fill="none" stroke="#ffffff" stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
    <path d="M388 292 V732"/>
    <path d="M388 292 H640"/>
    <path d="M388 512 H572"/>
    <path d="M388 732 H640"/>
  </g>
  <circle cx="700" cy="292" r="46" fill="#ffffff"/>
  <circle cx="700" cy="732" r="46" fill="#ffffff"/>
  <circle cx="640" cy="512" r="120" fill="url(#glow)"/>
  <circle cx="640" cy="512" r="50" fill="#7ff6ff" stroke="#ffffff" stroke-width="18"/>
  </g>
</svg>
