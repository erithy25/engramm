[package]
name = "engramm-app"
version = "3.2.0"
description = "ENGRAMM desktop app"
edition = "2021"
rust-version = "1.77"
license = "MIT"
publish = false

[lib]
name = "engramm_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
engramm-core = { path = "../../core", features = ["fetch"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
