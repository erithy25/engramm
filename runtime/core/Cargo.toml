[package]
name = "engramm-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "ENGRAMM runtime core v0: knowledge-pack manifests and verification, deterministic reply choice, message normalisation (conformant with the Python reference)"
license = "MIT"
publish = false

[lib]
name = "engramm_core"
path = "src/lib.rs"

[[bin]]
name = "engramm-core"
path = "src/bin/engramm-core.rs"

[dependencies]
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
ureq = { version = "2.10", optional = true, features = ["native-certs"] }
arti-client = { version = "0.47", optional = true, default-features = false, features = ["tokio", "rustls", "compression", "static-sqlite"] }
tor-rtcompat = { version = "0.47", optional = true, default-features = false, features = ["tokio", "rustls"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "io-util", "net", "time"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = { version = "0.26", optional = true }

[features]
default = []
fetch = ["dep:ureq"]
tor = ["fetch", "dep:arti-client", "dep:tor-rtcompat", "dep:tokio", "dep:tokio-rustls", "dep:webpki-roots"]

[profile.release]
lto = true
codegen-units = 1
strip = true
